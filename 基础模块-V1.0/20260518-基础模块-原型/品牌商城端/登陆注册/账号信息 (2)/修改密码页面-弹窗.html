<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 兆链采</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #f5f7fa; }
        .step-item { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
        .step-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 8px; transition: all 0.3s; }
        .step-line { position: absolute; top: 20px; left: 50%; width: 100%; height: 2px; transform: translateX(0); z-index: 0; }
        .step-line-bg { background-color: #e5e7eb; }
        .step-line-active { background-color: #3b82f6; }
        .step-pending .step-icon { background-color: #f3f4f6; color: #9ca3af; border: 2px solid #e5e7eb; }
        .step-active .step-icon { background-color: #3b82f6; color: white; border: 2px solid #3b82f6; }
        .step-completed .step-icon { background-color: #3b82f6; color: white; border: 2px solid #3b82f6; }
        .step-text { font-size: 13px; color: #6b7280; }
        .step-active .step-text { color: #3b82f6; font-weight: 500; }
        .step-completed .step-text { color: #3b82f6; }
        .input-group { display: flex; align-items: center; margin-bottom: 20px; }
        .input-label { width: 100px; text-align: right; padding-right: 12px; font-size: 14px; color: #374151; }
        .input-field { flex: 1; max-width: 320px; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

<!-- Logo -->
<div class="fixed top-4 left-6">
    <div class="flex items-center gap-2">
        <i class="fas fa-infinity text-blue-600 text-2xl"></i>
        <span class="text-xl font-semibold text-blue-600">兆链采</span>
    </div>
</div>

<!-- 演示控制 -->
<div class="fixed top-4 right-6 space-x-2 z-50">
    <button onclick="showStep(1)" class="bg-white px-3 py-1.5 rounded shadow text-xs hover:bg-gray-50 border border-gray-200">步骤1</button>
    <button onclick="showStep(2)" class="bg-white px-3 py-1.5 rounded shadow text-xs hover:bg-gray-50 border border-gray-200">步骤2</button>
    <button onclick="showStep(3)" class="bg-white px-3 py-1.5 rounded shadow text-xs hover:bg-gray-50 border border-gray-200">步骤3</button>
    <button onclick="showStep(4)" class="bg-white px-3 py-1.5 rounded shadow text-xs hover:bg-gray-50 border border-gray-200">步骤4</button>
</div>

<!-- 主内容 -->
<div class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <!-- 标题 -->
        <h1 class="text-xl font-medium text-gray-800 text-center mb-12">重置密码</h1>

        <!-- 步骤条 -->
        <div class="relative flex justify-between mb-12 px-4">
            <!-- 步骤1: 输入手机号 -->
            <div class="step-item step-active" id="step1-indicator">
                <div class="step-icon">
                    <i class="fas fa-mobile-alt text-sm"></i>
                </div>
                <span class="step-text">输入手机号</span>
                <div class="step-line step-line-active" style="width: 100px; left: 40px;" id="line1"></div>
            </div>

            <!-- 步骤2: 验证身份 -->
            <div class="step-item step-pending" id="step2-indicator">
                <div class="step-icon">
                    <i class="fas fa-user-check text-sm"></i>
                </div>
                <span class="step-text">验证身份</span>
                <div class="step-line step-line-bg" style="width: 100px; left: 40px;" id="line2"></div>
            </div>

            <!-- 步骤3: 设置新密码 -->
            <div class="step-item step-pending" id="step3-indicator">
                <div class="step-icon">
                    <i class="fas fa-key text-sm"></i>
                </div>
                <span class="step-text">设置新密码</span>
                <div class="step-line step-line-bg" style="width: 100px; left: 40px;" id="line3"></div>
            </div>

            <!-- 步骤4: 完成 -->
            <div class="step-item step-pending" id="step4-indicator">
                <div class="step-icon">
                    <i class="fas fa-check text-sm"></i>
                </div>
                <span class="step-text">完成</span>
            </div>
        </div>

        <!-- 步骤1: 输入手机号 -->
        <div id="step1-content" class="bg-white rounded-lg shadow-sm p-8 fade-in">
            <div class="input-group">
                <label class="input-label">手机号:</label>
                <div class="input-field">
                    <input type="tel" value="13823358736" readonly 
                        class="w-full bg-gray-50 border border-gray-200 rounded px-3 py-2 text-sm text-gray-500 cursor-not-allowed">
                </div>
            </div>
            <div class="flex justify-center mt-8">
                <button onclick="nextStep()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded text-sm font-medium transition-colors">
                    下一步
                </button>
            </div>
        </div>

        <!-- 步骤2: 验证身份 -->
        <div id="step2-content" class="bg-white rounded-lg shadow-sm p-8 fade-in hidden">
            <div class="input-group">
                <label class="input-label">短信验证码:</label>
                <div class="input-field flex gap-3">
                    <input type="text" placeholder="请输入验证码" 
                        class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <button onclick="getCode(this)" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition-colors whitespace-nowrap">
                        获取短信验证码
                    </button>
                </div>
            </div>
            <div class="flex justify-center mt-8">
                <button onclick="nextStep()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded text-sm font-medium transition-colors">
                    下一步
                </button>
            </div>
        </div>

        <!-- 步骤3: 设置新密码 -->
        <div id="step3-content" class="bg-white rounded-lg shadow-sm p-8 fade-in hidden">
            <div class="input-group">
                <label class="input-label">新密码:</label>
                <div class="input-field relative">
                    <input type="password" placeholder="请输入至少8位且包含大小写字母、数字和特殊字符(@#$%^&+=_...)" 
                        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pr-8">
                    <i class="far fa-eye-slash absolute right-3 top-2.5 text-gray-400 cursor-pointer hover:text-gray-600"></i>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">确认密码:</label>
                <div class="input-field relative">
                    <input type="password" placeholder="请输入至少8位且包含大小写字母、数字和特殊字符(@#$%^&+=_...)" 
                        class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pr-8">
                    <i class="far fa-eye-slash absolute right-3 top-2.5 text-gray-400 cursor-pointer hover:text-gray-600"></i>
                </div>
            </div>
            <div class="flex justify-center mt-8">
                <button onclick="submitPassword()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded text-sm font-medium transition-colors">
                    提交并登录
                </button>
            </div>
        </div>

        <!-- 步骤4: 完成 -->
        <div id="step4-content" class="bg-white rounded-lg shadow-sm p-12 fade-in hidden text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-3xl text-green-500"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-800">完成</h3>
            </div>
            <button onclick="resetFlow()" class="border border-gray-300 text-gray-600 hover:bg-gray-50 px-8 py-2 rounded text-sm font-medium transition-colors">
                返回
            </button>
        </div>
    </div>
</div>

<script>
    let currentStep = 1;
    let countdown = 0;

    function showStep(step) {
        currentStep = step;
        
        // 隐藏所有内容
        for (let i = 1; i <= 4; i++) {
            document.getElementById(`step${i}-content`).classList.add('hidden');
        }
        
        // 显示当前步骤内容
        document.getElementById(`step${step}-content`).classList.remove('hidden');
        
        // 更新步骤指示器
        updateStepIndicators();
    }

    function updateStepIndicators() {
        for (let i = 1; i <= 4; i++) {
            const indicator = document.getElementById(`step${i}-indicator`);
            const line = document.getElementById(`line${i}`);
            
            if (i < currentStep) {
                // 已完成
                indicator.className = 'step-item step-completed';
                if (line) {
                    line.className = 'step-line step-line-active';
                }
            } else if (i === currentStep) {
                // 当前
                indicator.className = 'step-item step-active';
                if (line) {
                    line.className = 'step-line step-line-active';
                }
            } else {
                // 待进行
                indicator.className = 'step-item step-pending';
                if (line) {
                    line.className = 'step-line step-line-bg';
                }
            }
        }
    }

    function nextStep() {
        if (currentStep < 4) {
            showStep(currentStep + 1);
        }
    }

    function submitPassword() {
        // 模拟提交成功
        nextStep();
    }

    function getCode(btn) {
        if (countdown > 0) return;
        
        btn.textContent = '60s后重试';
        btn.classList.add('bg-gray-400', 'cursor-not-allowed');
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        
        countdown = 60;
        const timer = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                btn.textContent = '获取短信验证码';
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            } else {
                btn.textContent = countdown + 's后重试';
            }
        }, 1000);
    }

    function resetFlow() {
        showStep(1);
    }

    // 页面加载显示步骤1
    window.onload = function() {
        showStep(1);
    };
</script>

</body>
</html>
