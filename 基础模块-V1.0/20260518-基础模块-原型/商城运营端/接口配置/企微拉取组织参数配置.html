<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兆链采供应链平台 - 企业微信配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
        }
        
        .sidebar-item:hover {
            background-color: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
        
        .sidebar-item.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border-right: 3px solid #3b82f6;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        
        .form-input {
            transition: all 0.3s ease;
            border: 1px solid #d1d5db;
        }
        
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        
        .form-input:hover {
            border-color: #9ca3af;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-group {
            position: relative;
        }
        
        .field-label {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
            line-height: 1.4;
        }
        
        .field-sublabel {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }
        
        .optional-tag {
            color: #9ca3af;
            font-size: 12px;
        }
        
        /* 输入框高度调整以匹配图片中的大输入框 */
        .large-input {
            min-height: 120px;
            resize: vertical;
        }
    </style>
</head>
<body class="text-gray-700 h-screen overflow-hidden">

    <!-- 顶部导航栏 -->
    <header class="glass-effect border-b border-gray-200 h-16 flex items-center justify-between px-6 fixed top-0 left-0 right-0 z-40">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 text-blue-600">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="text-xl font-bold tracking-tight">兆链采</span>
            </div>
            <span class="text-gray-400">|</span>
            <span class="text-gray-600 font-medium">供应链平台</span>
        </div>
        
        <div class="flex items-center gap-6">
            <button class="text-gray-500 hover:text-blue-600 transition-colors">
                <i class="fas fa-search text-lg"></i>
            </button>
            <button class="text-gray-500 hover:text-blue-600 transition-colors relative">
                <i class="far fa-bell text-lg"></i>
                <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white text-sm font-medium">
                    用
                </div>
                <span class="text-sm font-medium text-gray-700">用户名</span>
            </div>
        </div>
    </header>

    <div class="flex h-full pt-16">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col overflow-y-auto">
            <nav class="p-4 space-y-1">
                <div class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer text-sm font-medium">
                    <i class="fas fa-cog w-5"></i>
                    <span>设置</span>
                    <i class="fas fa-chevron-up ml-auto text-xs"></i>
                </div>
                
                <div class="ml-4 space-y-1">
                    <div class="sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg cursor-pointer text-sm text-blue-600 bg-blue-50 font-medium border-r-2 border-blue-600">
                        <span class="w-5"></span>
                        <span>企业微信配置</span>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
            <div class="max-w-6xl mx-auto fade-in">
                <!-- 页面标题 -->
                <div class="mb-8">
                    <h1 class="text-xl font-semibold text-gray-900">企业微信配置</h1>
                </div>

                <!-- 配置表单 -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
                    <div class="grid grid-cols-2 gap-x-12 gap-y-8">
                        
                        <!-- corpId 企业ID -->
                        <div class="input-group">
                            <div class="mb-2">
                                <label class="field-label">corpId</label>
                                <div class="field-sublabel">企业ID</div>
                            </div>
                            <textarea 
                                class="form-input w-full large-input p-4 text-sm text-gray-700 placeholder-gray-400 rounded-md" 
                                placeholder="请输入"
                            ></textarea>
                        </div>

                        <!-- corpSecret 应用密钥 -->
                        <div class="input-group">
                            <div class="mb-2">
                                <label class="field-label">corpSecret</label>
                                <div class="field-sublabel">应用密钥</div>
                            </div>
                            <textarea 
                                class="form-input w-full large-input p-4 text-sm text-gray-700 placeholder-gray-400 rounded-md" 
                                placeholder="请输入"
                            ></textarea>
                        </div>

                        <!-- agentId 应用ID -->
                        <div class="input-group">
                            <div class="mb-2">
                                <label class="field-label">agentId</label>
                                <div class="field-sublabel">应用ID</div>
                            </div>
                            <textarea 
                                class="form-input w-full large-input p-4 text-sm text-gray-700 placeholder-gray-400 rounded-md" 
                                placeholder="请输入"
                            ></textarea>
                        </div>

                        <!-- aesKey (消息通知选填) -->
                        <div class="input-group">
                            <div class="mb-2">
                                <label class="field-label">aesKey</label>
                                <div class="field-sublabel">
                                    <span class="optional-tag">（消息通知选填）</span>
                                </div>
                            </div>
                            <textarea 
                                class="form-input w-full large-input p-4 text-sm text-gray-700 placeholder-gray-400 rounded-md" 
                                placeholder="请输入"
                            ></textarea>
                        </div>

                    </div>
                </div>

                <!-- 底部操作按钮 -->
                <div class="flex justify-end gap-3 mt-8 pb-8">
                    <button class="btn-secondary px-6 py-2.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white">
                        取消
                    </button>
                    <button class="btn-primary px-6 py-2.5 rounded-md text-sm font-medium text-white flex items-center gap-2" onclick="saveConfig()">
                        <i class="fas fa-save text-xs"></i>
                        保存
                    </button>
                </div>

            </div>
        </main>
    </div>

    <!-- 保存成功提示 -->
    <div id="toast" class="fixed top-20 right-6 bg-white border-l-4 border-green-500 rounded-lg shadow-lg p-4 transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center">
            <i class="fas fa-check text-green-600 text-sm"></i>
        </div>
        <div>
            <h4 class="text-sm font-semibold text-gray-900">保存成功</h4>
            <p class="text-xs text-gray-500 mt-0.5">企业微信配置已更新</p>
        </div>
    </div>

    <script>
        // 保存配置
        function saveConfig() {
            const btn = document.querySelector('.btn-primary');
            const originalContent = btn.innerHTML;
            
            // 按钮加载状态
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> 保存中...';
            btn.disabled = true;
            btn.style.opacity = '0.8';
            
            // 模拟API调用
            setTimeout(() => {
                // 恢复按钮
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.style.opacity = '1';
                
                // 显示成功提示
                showToast();
            }, 800);
        }
        
        // 显示提示
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-x-full');
            
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }
        
        // 输入框焦点效果增强
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.01)';
                this.parentElement.style.transition = 'transform 0.2s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
        
        // 取消按钮返回
        document.querySelector('.btn-secondary').addEventListener('click', function() {
            if (confirm('确定要取消编辑吗？未保存的更改将丢失。')) {
                document.querySelectorAll('.form-input').forEach(input => {
                    input.value = '';
                });
            }
        });
    </script>
</body>
</html>
