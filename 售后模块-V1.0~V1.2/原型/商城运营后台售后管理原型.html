                                </div>
                                <div class="detail-customer-field">
                                    <div class="detail-customer-label">收货人</div>
                                    <div class="detail-customer-value">${item.receiverName || item.userName || "-"}</div>
                                </div>
                                <div class="detail-customer-field">
                                    <div class="detail-customer-label">收货人电话</div>
                                    <div class="detail-customer-value">${item.receiverPhone || "-"}</div>
                                </div>
                                <div class="detail-customer-field">
                                    <div class="detail-customer-label">收货地址</div>
                                    <div class="detail-customer-value">${(item.customerReturnAddresses && item.customerReturnAddresses[0] && item.customerReturnAddresses[0].detail) || "上海市浦东新区张江路 88 号"}</div>
                                </div>
                                <div class="detail-customer-field">
                                    <div class="detail-customer-label">售后原因</div>
                                    <div class="detail-customer-value">${item.reason || "-"}</div>
                                </div>
                                <div class="detail-customer-field">
                                    <div class="detail-customer-label">客户备注</div>
                                    <div class="detail-customer-value">${item.buyerNote || item.customerRemark || "无"}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Other Info Section -->
                        <div class="detail-customer-section">
                            <div class="detail-refund-header">
                                <div class="detail-refund-title">其他信息</div>
                            </div>
                            <div class="detail-customer-grid">
                                ${otherInfoRows}
                            </div>
                        </div>

                    </div>
                </div>
            `;

            pageContainer.style.display = "none";
            detailPage.classList.add("show");
        }

        function closeDetailPage() {
            const pageContainer = document.querySelector(".page-container");
            const detailPage = document.getElementById("detailPage");
            if (detailPage) {
                detailPage.classList.remove("show");
            }
            if (pageContainer) {
                pageContainer.style.display = "";
            }
        }

        function openRejectModal(item) {
            openModal({
                title: "驳回并备注",
                content: `
                    <p style="margin:0 0 12px;color:#666;line-height:1.8;">请填写驳回原因，提交后该售后单将进入已驳回状态。</p>
                    <textarea id="rejectRemarkInput" style="width:100%;min-height:120px;padding:12px;border:1px solid #d9d9d9;border-radius:6px;resize:vertical;font:inherit;" placeholder="请输入驳回备注"></textarea>
                `,
                isHtml: true,
                confirmText: "提交驳回",
                cancelText: "取消",
                onConfirm: () => {
                    const remark = document.getElementById("rejectRemarkInput").value.trim();
                    if (!remark) {
                        showToast("请先填写驳回备注");
                        return false;
                    }
                    item.status = "已驳回";
                    item.node = "售后已驳回";
                    item.primaryText = "查看结果";
                    item.secondaryText = "";
                    appendTimelineEvent(item, "售后已驳回", `商家已驳回该申请，备注：${remark}`);
                    closeModal();
                    render();
                    showToast("已驳回并记录备注");
                }
            });
        }

        function openRegisterReturnModal(item) {
            const confirmedAddresses = getPreferredReturnAddresses(item);
            openModal({
                title: "登记退货单号",
                content: `
                    <p style="margin:0 0 12px;color:#666;line-height:1.8;">请登记买家退货物流信息，售后单将进入待商家收货。</p>
                    <input id="returnCompanyInput" style="width:100%;height:40px;padding:0 12px;border:1px solid #d9d9d9;border-radius:6px;margin-bottom:10px;font:inherit;" placeholder="请输入物流公司" value="${item.returnCompany || ""}">
                    <input id="returnNoInput" style="width:100%;height:40px;padding:0 12px;border:1px solid #d9d9d9;border-radius:6px;margin-bottom:12px;font:inherit;" placeholder="请输入寄回单号" value="${item.returnNo || ""}">
                    <div style="font-weight:600;margin:8px 0 10px;color:#262626;">已确认退回地址</div>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${confirmedAddresses.map(address => `
                            <div style="padding:12px;border:1px solid #e5e6eb;border-radius:6px;background:#fafafa;color:#333;line-height:1.7;">
                                <div><strong>详细地址：</strong>${address.detail || "-"}</div>
                                <div><strong>姓名：</strong>${address.name || "-"}</div>
                                <div><strong>电话：</strong>${address.phone || "-"}</div>
                            </div>
                        `).join("")}
                    </div>
                `,
                isHtml: true,
                confirmText: "确认登记",
                cancelText: "取消",
                onConfirm: () => {
                    const company = document.getElementById("returnCompanyInput").value.trim();
                    const no = document.getElementById("returnNoInput").value.trim();
                    if (!company || !no) {
                        showToast("请填写完整物流信息");
                        return false;
                    }
                    item.returnCompany = company;
                    item.returnNo = no;
                    moveItemToWarehousePending(item);
                    closeModal();
                    render();
                }
            });
        }

        function approveRefundToPending(item, message = "审核已通过，请执行退款") {
            item.status = "待退款";
            item.node = "待执行退款";
            item.primaryText = "执行退款";
            item.secondaryText = "";
            markRefundPending(item);
            syncRefundFromAudit(item);
            updateRefundStatusFromAudit(item, "待退款", "待执行退款", "执行退款", "");
            render();
            showToast(message);
        }

        function approveReturnRefundNeedReturn(item) {
            item.status = "待买家退货";
            item.node = "待买家填写退货单号";
            item.primaryText = "登记退货单号";
            item.secondaryText = "驳回并备注";
            upsertReturnAddressBaseInfo(item, item.returnAddresses);
            setTimelineProgress(item, "active", "买家退货并填写单号");
            syncRefundFromAudit(item);
            updateRefundStatusFromAudit(item, "待买家退货", "待买家退货", "查看结果", "");
            render();
            showToast("审核已通过，进入退货单号登记");
        }

        function approveExchangeNeedReturn(item) {
            item.status = "待买家退货";
            item.node = "待买家填写退货单号";
            item.primaryText = "登记退货单号";
            item.secondaryText = "驳回并备注";
            upsertReturnAddressBaseInfo(item, item.returnAddresses);
            setTimelineProgress(item, "active", "买家退货并填写单号");
            render();
            showToast("换货审核已通过，进入退货单号登记");
        }

        function directRefundSuccess(item, options = {}) {
            item.status = "退款成功";
            item.node = "退款完成";
            item.primaryText = "";
            item.secondaryText = "";
            setTimelineProgress(item, "done", "完成退款");
            syncRefundFromAudit(item);
            updateRefundStatusFromAudit(item, "退款成功", "退款完成", "", "");
            render();
            if (!options.silentToast) {
                showToast("已无需退回商品，退款已完成");
            }
        }

        function openOperationSuccessModal(message = "操作成功！") {
            openModal({
                title: "提示",
                content: `
                    <div class="success-feedback">
                        <span class="success-feedback-icon">✓</span>
                        <div class="success-feedback-text">${message}</div>
                    </div>
                `,
                isHtml: true,
                confirmText: "知道了",
                hideCancel: true
            });
        }

        function openDirectRefundConfirmModal(item) {
            openModal({
                title: "同意退款",
                content: `
                    <div class="decision-info" style="margin-bottom:0;">
                        <span class="decision-info-icon">i</span>
                        <div>
                            <strong>确认直接退款</strong>
                            <span>买家无需退回商品，确认后系统将直接完成退款处理，并回写售后状态。该操作提交后不支持撤销，请谨慎操作。</span>
                        </div>
                    </div>
                `,
                isHtml: true,
                confirmText: "确定",
                cancelText: "取消",
                onConfirm: () => {
                    directRefundSuccess(item, { silentToast: true });
                    openOperationSuccessModal("退款处理成功！");
                    return false;
                }
            });
        }

        function openReturnRefundReviewModal(item) {
            const customerAddresses = (Array.isArray(item.customerReturnAddresses) ? item.customerReturnAddresses : []).map(normalizeReturnAddress);
            const supplierAddresses = (Array.isArray(item.supplierReturnAddresses) ? item.supplierReturnAddresses : []).map(normalizeReturnAddress);
            const reviewAddresses = getPreferredReturnAddresses(item);
            if (!reviewAddresses.length) {
                reviewAddresses.push(normalizeReturnAddress({}));
            }
            const addressRows = reviewAddresses.map((address, index) => `
                <div class="review-address-row" style="border:1px solid #e5e6eb;border-radius:8px;padding:12px;margin-bottom:10px;background:#fafafa;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                        <span style="font-weight:600;color:#262626;">退回地址 ${index + 1}</span>
                    </div>
                    <div style="display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:8px;">
                        <label style="color:#8c8c8c;">省市区</label>
                        ${buildRegionSelectorGroup(address)}
                    </div>
                    <div style="display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;margin-bottom:8px;">
                        <label style="color:#8c8c8c;margin-top:8px;">详细地址</label>
                        <textarea class="review-address-detail" style="width:100%;min-height:72px;padding:8px 10px;border:1px solid #d9d9d9;border-radius:6px;resize:vertical;font:inherit;" placeholder="请输入详细退货地址">${address.detail || ""}</textarea>
                    </div>
                    <div style="display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:8px;">
                        <label style="color:#8c8c8c;">收件人</label>
                        <input class="review-address-name" style="width:100%;height:38px;padding:0 10px;border:1px solid #d9d9d9;border-radius:6px;font:inherit;" placeholder="请输入收件人姓名" value="${address.name || ""}">
                    </div>
                    <div style="display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;">
                        <label style="color:#8c8c8c;">收件人手机号</label>
                        <input class="review-address-phone" style="width:100%;height:38px;padding:0 10px;border:1px solid #d9d9d9;border-radius:6px;font:inherit;" placeholder="请输入收件人手机号" value="${address.phone || ""}">
                    </div>
                </div>
            `).join("");
            openModal({
                title: "退货退款审核",
                content: `
                    <div class="decision-info">
                        <span class="decision-info-icon">i</span>
                        <div>
                            <strong>请选择处理方式</strong>
                            <span id="returnRefundReviewHint">若买家无需退回商品，可直接退款；若买家需要寄回商品，请确认退回地址后再推进售后流程。</span>
                        </div>
                    </div>
                    <button class="btn btn-primary decision-primary-btn" type="button" id="skipReturnRefundBtn">无需退回商品，直接退款</button>
                    <p class="decision-secondary-tip">如需买家寄回商品，请点击右下角“需要退回商品”并确认退回地址。</p>
                    <div id="returnAddressReviewPanel" style="display:none;">
                        <div class="review-panel-title">请确认退回地址</div>
                        <div id="reviewAddressList">${addressRows}</div>
                    </div>
                `,
                isHtml: true,
                confirmText: "需要退回商品",
                cancelText: "取消",
                onConfirm: () => {
                    const reviewPanel = document.getElementById("returnAddressReviewPanel");
                    if (reviewPanel.style.display === "none") {
                        reviewPanel.style.display = "block";
                        document.getElementById("returnRefundReviewHint").textContent = supplierAddresses.length
                            ? "已自动带出供应商退回地址，你也可以补充或调整后再确认。"
                            : customerAddresses.length
                                ? "已带出回传地址，请审核后确认；如无可用地址请由商家人工填写。"
                                : "当前无供应商回传地址，请由商家人工填写退回地址后再确认。";
                        modalConfirm.textContent = "确认退回地址";
                        return false;
                    }
                    const rows = Array.from(document.querySelectorAll(".review-address-row"));
                    const addresses = rows.map(row => ({
                        region: composeRegionValue(
                            row.querySelector(".review-address-province").value.trim(),
                            row.querySelector(".review-address-city").value.trim(),
                            row.querySelector(".review-address-district").value.trim()
                        ),
                        detail: row.querySelector(".review-address-detail").value.trim(),
                        name: row.querySelector(".review-address-name").value.trim(),
                        phone: row.querySelector(".review-address-phone").value.trim()
                    })).filter(address => address.detail || address.name || address.phone);
                    if (!addresses.length) {
                        showToast("请先填写退回地址");
                        return false;
                    }
                    if (addresses.some(address => !address.region)) {
                        showToast("请选择省市区");
                        return false;
                    }

                    const addresses = rows.map(row => ({

                            return;
                        }

                            if (remark) appendTimelineEvent(item, "审核备注", remark);

                        item.secondaryText = "";

                        } else {
                            updateAuditStatusFromRefund(item, "退款中", "退款处理中", "查看退款进度", "");
                            syncReturnFromRefund(item);

                        render();
                        showToast("已发起退款，等待支付回调");

                        <p style="margin:0 0 12px;color:#666;line-height:1.8;">请登记仓库发货物流信息，提交后售后单将进入待客户收货。</p>
                        <input id="shipCompanyInput" style="width:100%;height:40px;padding:0 12px;border:1px solid #d9d9d9;border-radius:6px;margin-bottom:10px;font:inherit;" placeholder="请输入快递公司" value="">
                        <input id="shipNoInput" style="width:100%;height:40px;padding:0 12px;border:1px solid #d9d9d9;border-radius:6px;margin-bottom:12px;font:inherit;" placeholder="请输入发货单号" value="">
                    `,

                        item.secondaryText = "";

                        appendTimelineEvent(item, "仓库已发货", `快递公司：${company}，发货单号：${no}`);

                        render();

                        <p style="margin:0 0 12px;color:#666;line-height:1.8;">发货单号：${item.expressNo || '-'}</p>
                        <p style="margin:0;color:#999;font-size:12px;">换货商品已发出，等待客户确认收货。若客户15天未确认，系统将自动确认为换货成功。</p>
                    `,
                    isHtml: true,
                    confirmText: "我知道了",
                    hideCancel: true
                });
                return;
            }

            if (item.primaryText === "查看退款进度") {
                openRefundProgressModal(item);
                return;
            }

            if (item.primaryText === "查看详情" || item.primaryText === "详情") {
                showDetailModal(item);
                return;
            }

            if (item.primaryText === "重新发起退款") {
                openModal({
                    title: "重新发起退款",
                    content: `<div style="line-height:1.8;color:#333;"><p style="margin:0 0 12px;color:#666;">确认重新发起退款？售后单号：${item.id}，退款金额：${item.amount}。</p><p style="margin:0;color:#999;font-size:13px;">上次退款失败，重新发起将再次请求支付渠道处理，请确认。</p></div>`,
                    isHtml: true,
                    confirmText: "确认退款",
                    cancelText: "取消",
                    onConfirm: () => {
                        closeModal();
                        item.status = "退款中";
                        item.node = "退款处理中";
                        item.primaryText = "查看退款进度";
                        item.secondaryText = "";
                        markRefundPending(item);
                        if (state.activeTab === "audit") {
                            syncRefundFromAudit(item);
                            updateRefundStatusFromAudit(item, "退款中", "退款处理中", "查看退款进度", "");

                            updateAuditStatusFromRefund(item, "退款中", "退款处理中", "查看退款进度", "");

        function getCurrentList() {
            const mainOrderNo = document.getElementById("mainOrderInput").value.trim();
            const subOrderNo = document.getElementById("subOrderInput").value.trim();
            const aftersalesNo = document.getElementById("aftersalesInput").value.trim();
            const productName = document.getElementById("productNameInput").value.trim();
            const skuLogisticsCode = document.getElementById("skuLogisticsInput").value.trim();
            const supplierInfo = document.getElementById("supplierInput").value.trim();
            const receiverPhone = document.getElementById("receiverPhoneInput").value.trim();
            const createdDateStart = document.getElementById("createdDateStartInput").value;
            const createdDateEnd = document.getElementById("createdDateEndInput").value;
            const status = document.getElementById("statusSelect").value;
            const auditStatus = document.getElementById("auditStatusSelect").value;
            const type = document.getElementById("typeSelect").value;
            const channel = document.getElementById("channelSelect").value;

            return dataMap[state.activeTab].filter(item => {
                const matchMainOrder = !mainOrderNo || [item.orderNo, item.mainOrderNo].filter(Boolean).some(value => value.includes(mainOrderNo));
                const matchSubOrder = !subOrderNo || (item.subOrderNo || "").includes(subOrderNo);
                const matchAftersalesNo = !aftersalesNo || [item.id, item.aftersalesOrderNo, item.sourceAuditId, item.sourceRefundId].filter(Boolean).some(value => value.includes(aftersalesNo));
                const matchProductName = !productName || (item.productName || "").includes(productName);
                const matchSkuLogistics = !skuLogisticsCode || [item.skuLogisticsCode, item.skuCode, item.logisticsCode, item.productCode, item.expressNo].filter(Boolean).some(value => value.includes(skuLogisticsCode));
                const matchSupplier = !supplierInfo || [item.supplierName, item.supplierCode].filter(Boolean).some(value => value.includes(supplierInfo));
                const matchReceiverPhone = !receiverPhone || [item.receiverPhone, item.userPhone, item.orderPhone].filter(Boolean).some(value => value.includes(receiverPhone));
                const itemCreatedDate = String(item.createdAt || "").split(" ")[0];
                const matchCreatedDate = (!createdDateStart || itemCreatedDate >= createdDateStart) && (!createdDateEnd || itemCreatedDate <= createdDateEnd);
                const matchStatus = state.activeTab !== "audit" || status === "all" || item.status === status;
            const matchAuditStatus = state.activeTab !== "audit" || auditStatus === "all" || (auditTypeStatusMap[auditStatus] && auditTypeStatusMap[auditStatus].includes(item.status));
                const matchType = type === "all" || item.type === type;
                const matchChannel = channel === "all" || item.channel === channel;
                const matchAuditType = state.activeTab !== "audit" || state.activeAuditType === "all" || (auditTypeStatusMap[state.activeAuditType] && auditTypeStatusMap[state.activeAuditType].includes(item.status));
                return matchMainOrder && matchSubOrder && matchAftersalesNo && matchProductName && matchSkuLogistics && matchSupplier && matchReceiverPhone && matchCreatedDate && matchStatus && matchAuditStatus && matchType && matchChannel && matchAuditType;
            });
        }

        function getPagedList(list) {
            const currentPage = state.pagination[state.activeTab] || 1;
            const start = (currentPage - 1) * state.pageSize;
            return list.slice(start, start + state.pageSize);
        }

        function renderPagination(total) {
            const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
            if (state.pagination[state.activeTab] > totalPages) {
                state.pagination[state.activeTab] = totalPages;
            }
            const current = state.pagination[state.activeTab];

            const controls = [
                { label: "首页", page: 1, disabled: current === 1 },
                { label: "上一页", page: Math.max(1, current - 1), disabled: current === 1 }
            ];

            for (let page = 1; page <= totalPages; page += 1) {
                controls.push({ label: String(page), page, active: page === current });
            }

            controls.push({ label: "下一页", page: Math.min(totalPages, current + 1), disabled: current === totalPages });
            controls.push({ label: "末页", page: totalPages, disabled: current === totalPages });

            paginationControls.innerHTML = controls.map(control => `
                <button
                    class="page-btn ${control.active ? "active" : ""}"
                    type="button"
                    data-page="${control.page}"
                    ${control.disabled ? "disabled" : ""}
                >${control.label}</button>
            `).join("");

            paginationControls.querySelectorAll(".page-btn").forEach(button => {
                button.addEventListener("click", () => {
                    state.pagination[state.activeTab] = Number(button.dataset.page);
                    render();
                });
            });
        }

        function renderTable() {
            const list = getCurrentList();
            const pagedList = getPagedList(list);
            const tab = state.activeTab;
            tableTitle.textContent = tab === "audit" ? "售后审核列表" : "退货单列表";
            pageTotal.textContent = `共 ${list.length} 条`;

                <th style="width:14%;">供应商信息</th>
                <th style="width:14%;">客户信息</th>
                <th style="width:8%;">售后类型</th>
                <th style="width:8%;">退款金额</th>
                <th style="width:8%;">申请时间</th>
                <th style="width:8%;">售后状态</th>
                <th style="width:8%;">渠道来源</th>
                <th style="width:10%;">操作</th>
            `;
            const returnHead = `
                <th style="width:14%;">退货单号</th>
                <th style="width:12%;">主订单号</th>
                <th style="width:12%;">子订单号</th>
                <th style="width:14%;">商品名称</th>

                <th style="width:8%;" class="action-col-header">操作</th>
            `;
            tableHeadRow.innerHTML = tab === "return" ? returnHead : commonHead;
            mainTable.classList.toggle("return-table-mode", tab === "return");

            const renderActionCell = item => {
                const showPrimary = item.primaryText && item.primaryText !== "查看详情" && item.primaryText !== "详情";
                const isReturnTab = tab === "return";
                const actionClass = isReturnTab ? "table-action return-action" : "table-action";
                return `
                    <div class="${actionClass}">
                        <button class="btn btn-link" type="button" data-action="detail" data-id="${item.id}">详情</button>
                        ${showPrimary ? `<button class="btn btn-link" type="button" data-action="primary" data-id="${item.id}">${item.primaryText}</button>` : ""}
                        ${item.secondaryText ? `<button class="btn btn-link" type="button" data-action="secondary" data-id="${item.id}">${item.secondaryText}</button>` : ""}
                    </div>
                `;
            };

            const rows = pagedList.map(item => {
                if (tab === "return") {
                    return `
                        <tr data-id="${item.id}" class="${item.id === state.selectedId ? "active" : ""}">
                            <td><div class="cell-title">${item.id}</div><div class="cell-sub">${item.channel}</div></td>
                            <td>${item.mainOrderNo || item.orderNo || "-"}</td>
                            <td>${item.subOrderNo || "-"}</td>
                            <td><div class="cell-title">${item.productName}</div><div class="cell-sub">${item.skuText}</div></td>
                            <td>${item.returnQty || "-"}</td>
                            <td><div class="amount-main">${item.totalPrice || item.amount || "-"}</div></td>
                            <td><span class="status ${statusClassMap[item.status] || "wait"}">${item.status}</span></td>
                            <td>${item.createdAt || "-"}</td>
                            <td class="action-col-cell">${renderActionCell(item)}</td>
                        </tr>
                    `;
                }
                return `
                    <tr data-id="${item.id}" class="${item.id === state.selectedId ? "active" : ""}">
                        <td>
                            <div class="cell-title">主：${item.orderNo}</div>
                            <div class="cell-sub">子：${item.subOrderNo}</div>
                        </td>
                        <td>
                            <div class="product-cell">
                                <div class="product-thumb"></div>
                                <div class="product-meta">
                                    <div class="cell-title">${item.productName}</div>
                                    <div class="cell-sub">${item.skuText}</div>
                                    <div class="cell-sub">SKU物流编码：${item.skuLogisticsCode || item.skuCode || "-"}</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="cell-title">供应商：${item.supplierName || "-"}</div>
                            <div class="cell-sub">供应商编号：${item.supplierCode || "-"}</div>
                        </td>
                        <td>
                            <div class="cell-title">收货人电话号码：${item.receiverPhone || "-"}</div>
                            <div class="cell-sub">用户电话：${item.userPhone || "-"}</div>
                        </td>
                        <td>
                            <div class="cell-title">${item.type}</div>
                        </td>
                        <td>
                            <div class="amount-main">${item.amount}</div>
                            <div class="cell-sub">${item.type.includes("退") ? "待退款处理" : "售后处理中"}</div>
                        </td>
                        <td>
                            <div class="cell-title">${item.createdAt.split(" ")[0]}</div>
                            <div class="cell-sub">${item.createdAt.split(" ")[1]}</div>
                        </td>
                        <td>
                            <span class="status ${statusClassMap[item.status] || "wait"}">${item.status}</span>
                        </td>
                        <td>
                            <div class="cell-title">${item.channel || "-"}</div>
                        </td>
                        <td>${renderActionCell(item)}</td>
                    </tr>
                `;
            }).join("");

            const colspan = tab === "return" ? 9 : 10;
            tableBody.innerHTML = rows || `<tr><td colspan="${colspan}" style="text-align:center;padding:48px 0;color:#8c8c8c;">暂无符合条件的数据</td></tr>`;
        }

        function renderNav() {
            document.querySelectorAll(".submenu-item").forEach(item => {
                const isActive = item.dataset.subnav === state.activeTab;
                item.classList.toggle("active", isActive);
            });

            document.querySelectorAll("[data-tab]").forEach(tab => {
                tab.classList.toggle("active", tab.dataset.tab === state.activeTab);
            });
            document.querySelectorAll(".audit-type-card").forEach(card => {
                card.classList.toggle("active", card.dataset.auditType === state.activeAuditType);
            });
            document.getElementById("auditTypes").style.display = state.activeTab === "audit" ? "inline-flex" : "none";
        }

        function syncTypeSelectState() {
            const typeSelect = document.getElementById("typeSelect");
            typeSelect.disabled = false;
        }

        function bindTableEvents() {
            document.querySelectorAll("#tableBody tr[data-id]").forEach(row => {
                row.onclick = event => {
                    const action = event.target.dataset.action;
                    const id = row.dataset.id;
                    const item = dataMap[state.activeTab].find(entry => entry.id === id);
                    state.selectedId = id;
                    if (!item) {
                        render();
                        return;
                    }

                    if (action === "primary") {
                        handlePrimaryAction(item);
                        return;
                    }

                    if (action === "secondary") {
                        handleSecondaryAction(item);
                        return;
                    }

                    if (action === "detail") {
                        showDetailModal(item);
                        return;
                    }

                    render();
                };
            });
        }

        function render() {
            renderNav();
            syncTypeSelectState();
            document.getElementById("statusSelect").parentElement.parentElement.style.display = state.activeTab === "audit" ? "flex" : "none";
            document.getElementById("auditStatusSelect").parentElement.parentElement.style.display = state.activeTab === "audit" ? "flex" : "none";
            renderTable();
            bindTableEvents();
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            state.selectedId = dataMap[state.activeTab]?.[0]?.id || "";
            state.activeAuditType = "all";
            state.pagination[state.activeTab] = 1;
            document.getElementById("mainOrderInput").value = "";
            document.getElementById("subOrderInput").value = "";
            document.getElementById("aftersalesInput").value = "";
            document.getElementById("productNameInput").value = "";
            document.getElementById("skuLogisticsInput").value = "";
            document.getElementById("supplierInput").value = "";
            document.getElementById("receiverPhoneInput").value = "";
            document.getElementById("createdDateStartInput").value = "";
            document.getElementById("createdDateEndInput").value = "";
            document.getElementById("statusSelect").value = "all";
            document.getElementById("auditStatusSelect").value = "all";
            document.getElementById("typeSelect").value = "all";
            document.getElementById("channelSelect").value = "all";
            document.getElementById("statusSelect").parentElement.parentElement.style.display = tabName === "audit" ? "flex" : "none";
            document.getElementById("auditStatusSelect").parentElement.parentElement.style.display = tabName === "audit" ? "flex" : "none";
            syncDateFieldUI("createdDateStartInput", "开始时间");
            syncDateFieldUI("createdDateEndInput", "结束时间");
            render();
        }

        function syncDateFieldUI(inputId, emptyText) {
            const input = document.getElementById(inputId);
            const trigger = document.getElementById(inputId.replace("Input", "Trigger"));
            const display = document.getElementById(inputId.replace("Input", "Display"));
            const clearButton = document.getElementById(inputId.replace("Input", "Clear"));
            if (!input || !trigger || !display || !clearButton) {
                return;
            }
            const hasValue = Boolean(input.value);
            trigger.classList.toggle("is-empty", !hasValue);
            display.textContent = hasValue ? input.value : emptyText;
            clearButton.hidden = !hasValue;
        }

        function openDatePicker(inputId) {
            const input = document.getElementById(inputId);
            if (!input) {
                return;
            }
            if (typeof input.showPicker === "function") {
                input.showPicker();
                return;
            }
            input.focus();
            input.click();
        }

        function bindDateField(inputId, emptyText) {
            const input = document.getElementById(inputId);
            const trigger = document.getElementById(inputId.replace("Input", "Trigger"));
            const pickerButton = document.getElementById(inputId.replace("Input", "Picker"));
            const clearButton = document.getElementById(inputId.replace("Input", "Clear"));
            if (!input || !trigger || !pickerButton || !clearButton) {
                return;
            }

            const sync = () => syncDateFieldUI(inputId, emptyText);
            sync();

            pickerButton.addEventListener("click", event => {
                event.preventDefault();
                event.stopPropagation();
                openDatePicker(inputId);
            });

            trigger.addEventListener("click", event => {
                if (event.target === clearButton) {
                    return;
                }
                openDatePicker(inputId);
            });

            clearButton.addEventListener("click", event => {
                event.preventDefault();
                event.stopPropagation();
                input.value = "";
                sync();
            });

            input.addEventListener("change", sync);
            input.addEventListener("input", sync);
        }

        document.querySelectorAll("[data-tab]").forEach(button => {
            button.addEventListener("click", () => switchTab(button.dataset.tab));
        });

        document.querySelectorAll(".submenu-item").forEach(item => {
            item.addEventListener("click", () => switchTab(item.dataset.subnav));
        });

        document.querySelectorAll('[data-filter-toggle]').forEach(button => {
            button.addEventListener("click", () => {
                const filterCard = document.getElementById("filterCard");
                const isCollapsed = button.dataset.filterToggle === "expand"
                    ? false
                    : button.dataset.filterToggle === "collapse"
                        ? true
                        : filterCard.classList.toggle("is-collapsed");
                filterCard.classList.toggle("is-collapsed", isCollapsed);
                document.getElementById("toggleFilterBtn").textContent = isCollapsed ? "展开" : "收起";
            });
        });

        document.getElementById("afterSalesMenu").addEventListener("click", () => {
            afterSalesSubmenu.style.display = afterSalesSubmenu.style.display === "none" ? "grid" : "none";
        });

        document.querySelectorAll(".audit-type-card").forEach(card => {
            card.addEventListener("click", () => {
                const type = card.dataset.auditType;
                state.activeAuditType = type;
                state.pagination.audit = 1;
                // 同步下拉框
                document.getElementById("auditStatusSelect").value = type;
                if (type === "all") {
                    const match = getCurrentList()[0];
                    if (match) {
                        state.selectedId = match.id;
                    }
                } else {
                    const statusList = auditTypeStatusMap[type];
                    if (statusList) {
                        const match = getCurrentList().find(item => statusList.includes(item.status));
                        if (match) {
                            state.selectedId = match.id;
                        }
                    }
                }
                render();
                const title = card.querySelector(".audit-type-title").textContent;
                showToast(`已切换到${title}`);
            });
        });

        document.querySelectorAll('[data-filter-action="search"]').forEach(button => {
            button.addEventListener("click", () => {
                // 下拉框切换时同步tab
                const auditStatus = document.getElementById("auditStatusSelect").value;
                state.activeAuditType = auditStatus;
                state.pagination[state.activeTab] = 1;
                render();
            });
        });
        document.querySelectorAll('[data-filter-action="reset"]').forEach(button => {
            button.addEventListener("click", () => {
                document.getElementById("mainOrderInput").value = "";
                document.getElementById("subOrderInput").value = "";
                document.getElementById("aftersalesInput").value = "";
                document.getElementById("productNameInput").value = "";
                document.getElementById("skuLogisticsInput").value = "";
                document.getElementById("supplierInput").value = "";
                document.getElementById("receiverPhoneInput").value = "";
                document.getElementById("createdDateStartInput").value = "";
                document.getElementById("createdDateEndInput").value = "";
                document.getElementById("statusSelect").value = "all";
                document.getElementById("auditStatusSelect").value = "all";
                document.getElementById("typeSelect").value = "all";
                document.getElementById("typeSelect").disabled = false;
                document.getElementById("channelSelect").value = "all";
                // 重置时同步tab到全部
                state.activeAuditType = "all";
                state.pagination[state.activeTab] = 1;
                syncDateFieldUI("createdDateStartInput", "开始时间");
                syncDateFieldUI("createdDateEndInput", "结束时间");
                render();
            });
        });

        document.getElementById("messageBtn").addEventListener("click", () => showToast("消息中心待补充。"));
        document.getElementById("userBtn").addEventListener("click", () => showToast("用户信息面板待补充。"));
        document.querySelectorAll(".menu-item[data-menu]").forEach(item => {
            item.addEventListener("click", () => {
                showToast(`已点击${item.textContent.trim()}，当前先保留为占位入口。`);
            });
        });

        document.getElementById("modalClose").addEventListener("click", () => {
            if (modalCancelHandler) {
                modalCancelHandler();
            }
            closeModal();
        });
        modalCancel.addEventListener("click", () => {
            if (modalCancelHandler) {
                modalCancelHandler();
            }
            closeModal();
        });
        modalConfirm.addEventListener("click", () => {
            if (modalConfirmHandler) {
                const result = modalConfirmHandler();
                if (result === false) {
                    return;
                }
            } else {
                closeModal();
            }
        });
        modalOverlay.addEventListener("click", event => {
            if (event.target.id === "modalOverlay") closeModal();
        });

        bindDateField("createdDateStartInput", "开始时间");
        bindDateField("createdDateEndInput", "结束时间");
        initRefundListFromAudit();
        syncReturnListFromRefunds();
        normalizeDataView();
        render();
    </script>
</body>
</html>
