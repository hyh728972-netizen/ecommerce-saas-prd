*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans CN",-apple-system,sans-serif;color:var(--text-dark);background:var(--bg-page);line-height:1.5;min-width:var(--page-width);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{outline:none;border:none;font-family:inherit}

:root{
  --page-width:1600px;
  --jd-red:#f63218;
  --price:#ff0f12;
  --text-dark:rgba(0,0,0,.85);
  --text-mid:#666;
  --text-light:#999;
  --bg-page:#f4f4f4;
  --border-light:#f0f0f0;
  --radius:8px;
  --radius-lg:12px;
  --shadow-card:0 2px 12px rgba(0,0,0,.06);
  --icon-cart:url(https://img11.360buyimg.com/img/jfs/t1/299913/28/14314/667/68afc75cFbc268bc7/0b4232db253d0e2a.png);
  --icon-cart-hover:url(https://img12.360buyimg.com/img/jfs/t1/329610/14/5367/642/68afc86aF292b557f/49aac701bcc27b4f.png);
}

.container{width:var(--page-width);margin:0 auto}

.pd-header{background:#fff;border-bottom:1px solid #eee;padding:16px 0 0}
.pd-header-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:12px;align-items:start}
.pd-logo{cursor:pointer;padding-top:4px}
.pd-logo .logo-text{font-size:32px;font-weight:700;color:var(--jd-red);letter-spacing:1px;line-height:1.15;text-align:center}
.pd-logo .logo-sub{font-size:12px;color:var(--text-mid);margin-top:6px;text-align:center;letter-spacing:.5px}
.pd-search-col{min-width:0}
.pd-search{display:flex;border:2px solid var(--jd-red);border-radius:var(--radius);overflow:hidden;background:#fff}
.pd-search input{flex:1;min-width:0;height:42px;padding:0 16px;font-size:15px}
.pd-search button{width:80px;height:38px;margin:2px;background:var(--jd-red);color:#fff;font-size:15px;font-weight:600;border-radius:6px}
.search-hot{margin-top:10px;padding-left:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;line-height:1.4}
.search-hot a{font-size:12px;color:var(--text-mid);white-space:nowrap;transition:color .2s}
.search-hot a:hover{color:var(--jd-red)}
.search-hot a.hot-highlight{color:var(--jd-red);font-weight:500}
.pd-cart-col{display:flex;justify-content:flex-end;padding-top:2px}
.pd-header-cart{display:flex;flex-direction:column;align-items:center;gap:4px;color:#333;font-size:12px;cursor:pointer;position:relative;padding:4px 8px;min-width:72px}
.pd-header-cart .cart-icon-img{width:28px;height:28px;object-fit:contain}
.pd-header-cart .badge{position:absolute;top:0;right:4px;min-width:16px;height:16px;background:var(--jd-red);color:#fff;font-size:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
.pd-breadcrumb{font-size:13px;color:var(--text-mid);padding:12px 0 14px;margin-top:12px;border-top:1px solid #f5f5f5;line-height:1.5}
.pd-breadcrumb a{color:var(--text-mid);transition:color .15s}
.pd-breadcrumb a:hover{color:var(--jd-red)}
.pd-breadcrumb span{margin:0 6px;color:#ccc}

.zone-main{padding:12px 0 32px;display:flex;flex-direction:column;gap:20px}

.zone-group{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.zone-banner{position:relative;display:block;height:300px;overflow:hidden;background:#e8e8e8;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.zone-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zone-banner-mask{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.22) 42%,transparent 70%)}
.zone-banner-copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 40px;color:#fff;max-width:52%}
.zone-banner-title{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:1px}
.zone-banner-sub{font-size:15px;margin-top:10px;opacity:.92}
.zone-banner-go{display:inline-flex;align-items:center;margin-top:16px;font-size:13px;padding:6px 16px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);width:fit-content}
.zone-banner:hover .zone-banner-go{background:rgba(255,255,255,.28)}

.zone-goods-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid var(--border-light);overflow:hidden}
.zone-scroll-wrap{padding:0 16px 14px;overflow:hidden}
.zone-scroll{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:14px 0 6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#ddd transparent}
.zone-scroll::-webkit-scrollbar{height:6px}
.zone-scroll::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
.zone-scroll::-webkit-scrollbar-thumb:hover{background:#ccc}

.zone-product{flex:0 0 176px;width:176px;scroll-snap-align:start;border:1px solid var(--border-light);border-radius:var(--radius);background:#fff;overflow:hidden;cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .2s}
.zone-product:hover{box-shadow:0 6px 18px rgba(246,50,24,.1);border-color:#ffd0d0;transform:translateY(-2px)}
.zone-product-img{aspect-ratio:1;background:#f8f8f8;overflow:hidden}
.zone-product-img img{width:100%;height:100%;object-fit:cover}
.zone-product-info{padding:8px 8px 10px}
.zone-product-name{font-size:12px;color:var(--text-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.zone-product-name .brand{color:var(--jd-red);font-weight:600}
.zone-product-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;gap:4px}
.zone-product-price{font-size:18px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;line-height:1}
.zone-product-price em{font-size:12px;font-style:normal;font-weight:700}
.zone-cart-add{width:28px;height:28px;border-radius:6px;background:#fff;border:1px solid #e8e8e8;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.zone-cart-add .cart-icon{display:block;width:16px;height:16px;background:var(--icon-cart) center/contain no-repeat}
.zone-cart-add:hover{border-color:var(--jd-red)}
.zone-cart-add:hover .cart-icon{background-image:var(--icon-cart-hover)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;width:400px;overflow:hidden}
.modal-header{display:flex;justify-content:flex-end;padding:16px 16px 0}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-light);border-radius:50%}
.modal-close:hover{background:#f5f5f5}
.modal-tabs{display:flex;padding:0 24px;gap:20px;border-bottom:1px solid #eee}
.modal-tab{font-size:15px;color:var(--text-light);cursor:pointer;padding:12px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.modal-tab.active{color:var(--jd-red);border-bottom-color:var(--jd-red);font-weight:600}
.modal-body{padding:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text-mid);margin-bottom:6px}
.form-input{width:100%;height:42px;border:1px solid #ddd;border-radius:6px;padding:0 12px;font-size:14px}
.form-input:focus{border-color:var(--jd-red)}
.form-row{display:flex;gap:10px}
.form-row .form-input{flex:1}
.sms-btn{width:110px;height:42px;background:#fff;border:1px solid var(--jd-red);color:var(--jd-red);border-radius:6px;font-size:13px}
.modal-submit{width:100%;height:44px;background:var(--jd-red);color:#fff;border-radius:6px;font-size:15px;font-weight:600;margin-top:6px}
</style>

const DETAIL_PAGE = '05.商品详情页-原型页面.html';
const SEARCH_PAGE = '04.搜索分类页-原型页面.html';

function formatPrice(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function getBrand(name, brand) {
  if (brand) return brand;
  var cn = name.match(/^[\u4e00-\u9fa5]{2,4}/);
  return cn ? cn[0] : name.split(/\s/)[0].slice(0, 6);
}

function renderScrollProduct(p) {
  var brand = getBrand(p.name, p.brand);
  return '<div class="zone-product" onclick="location.href=\'' + DETAIL_PAGE + '\'">' +
    '<div class="zone-product-img"><img src="' + p.img + '" alt="' + p.name + '"></div>' +
    '<div class="zone-product-info">' +
    '<div class="zone-product-name"><span class="brand">【' + brand + '】</span>' + p.name + '</div>' +
    '<div class="zone-product-bottom">' +
    '<div class="zone-product-price"><em>¥</em>' + formatPrice(p.price) + '</div>' +
    '<button type="button" class="zone-cart-add" title="加入购物车" onclick="event.stopPropagation();ProtoToast.show()"><i class="cart-icon"></i></button>' +
    '</div></div></div>';
}

function renderZoneBlock(z) {
  var href = ACTIVITY_PAGE + '?id=' + z.id;
  var productsHtml = z.products.map(renderScrollProduct).join('');
  return '<section class="zone-group" id="' + z.id + '">' +
    '<a class="zone-banner" href="' + href + '">' +
    '<img src="' + z.img + '" alt="' + z.title + '">' +
    '<span class="zone-banner-mask"></span>' +
    '<span class="zone-banner-copy">' +
    '<span class="zone-banner-title">' + z.title + '</span>' +
    '<span class="zone-banner-sub">' + z.sub + '</span>' +
    '<span class="zone-banner-go">进入专题 ›</span></span></a>' +
    '<div class="zone-goods-card"><div class="zone-scroll-wrap"><div class="zone-scroll">' + productsHtml + '</div></div></div>' +
    '</section>';
}

function initZoneAutoScroll() {
  var CARD_W = 176;
  var GAP = 12;
  var STEP = CARD_W + GAP;
  var INTERVAL = 2800;

  document.querySelectorAll('.zone-scroll').forEach(function (el) {
    var paused = false;
    el.addEventListener('mouseenter', function () { paused = true; });
    el.addEventListener('mouseleave', function () { paused = false; });

    setInterval(function () {
      if (paused) return;
      var max = el.scrollWidth - el.clientWidth;
      if (max <= 0) return;
      var next = el.scrollLeft + STEP;
      if (next >= max - 2) {
        el.scrollTo({ left: 0, behavior: 'auto' });
      } else {
        el.scrollTo({ left: next, behavior: 'smooth' });
      }
    }, INTERVAL);
  });
}

  var hash = (location.hash || '').replace('#', '');

  var map = { brand: 'apple-wear', welfare: 'welfare-food' };

})();

const UC_USER = { name: '张经理', cartCount: 15 };

function applyUcState(state) {
  var logged = state === 'logged';
  var headerBadge = document.getElementById('headerCartBadge');
  if (typeof SiteTopBar !== 'undefined') {
    SiteTopBar.setLogged(logged, { userName: UC_USER.name, cartCount: logged ? UC_USER.cartCount : 0 });
  }
  if (headerBadge) headerBadge.textContent = logged ? String(UC_USER.cartCount) : '0';
  if (typeof FloatDock !== 'undefined') FloatDock.setCartCount(logged ? UC_USER.cartCount : 0);
  if (logged) ProtoAuth.login({ userName: UC_USER.name, cartCount: UC_USER.cartCount });
  else ProtoAuth.logout();
}
applyUcState(ProtoAuth.isLogged() ? 'logged' : 'guest');

document.getElementById('loginModal').addEventListener('click', function (e) {
  if (e.target.id === 'loginModal') closeLogin();
  if (e.target.classList.contains('modal-submit')) {
    ProtoAuth.login({ userName: UC_USER.name, cartCount: UC_USER.cartCount });
    applyUcState('logged');
    closeLogin();
  }
});

function openLogin() { document.getElementById('loginModal').classList.add('active'); }
function closeLogin() { document.getElementById('loginModal').classList.remove('active'); }

function switchLoginTab(el, type) {
  document.querySelectorAll('.modal-tab').forEach(function (t) { t.classList.remove('active'); });

}
