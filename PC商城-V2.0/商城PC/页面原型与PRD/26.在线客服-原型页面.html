<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/topbar.css">
<link rel="stylesheet" href="../assets/site-footer.css">
<link rel="stylesheet" href="../assets/proto-toast.css">
<link rel="stylesheet" href="../assets/float-dock.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:rgba(0,0,0,.85);background:#f4f4f4;line-height:1.5;min-width:1600px}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
:root{--page-width:1600px;--jd-red:#f63218;--radius:8px}
.container{width:var(--page-width);margin:0 auto}
.pd-header{background:#fff;border-bottom:1px solid #eee;padding:16px 0 0}
.pd-header-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:12px;align-items:start}
.pd-logo{cursor:pointer;padding-top:4px}
.pd-logo .logo-text{font-size:32px;font-weight:700;color:var(--jd-red);letter-spacing:1px;line-height:1.15;text-align:center}
.pd-logo .logo-sub{font-size:12px;color:#666;margin-top:6px;text-align:center}
.pd-search{display:flex;border:2px solid var(--jd-red);border-radius:var(--radius);overflow:hidden;background:#fff}
.pd-search input{flex:1;height:42px;padding:0 16px;font-size:15px;border:none;outline:none;font-family:inherit}
.pd-search button{width:80px;height:38px;margin:2px;background:var(--jd-red);color:#fff;font-size:15px;font-weight:600;border-radius:6px}
.pd-cart-col{display:flex;justify-content:flex-end;padding-top:2px}
.pd-header-cart{display:flex;flex-direction:column;align-items:center;gap:4px;color:#333;font-size:12px;cursor:pointer;position:relative;padding:4px 8px}
.pd-header-cart .cart-icon-img{width:28px;height:28px;object-fit:contain}
.pd-header-cart .badge{position:absolute;top:0;right:4px;min-width:16px;height:16px;background:var(--jd-red);color:#fff;font-size:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
.pd-breadcrumb{font-size:13px;color:#666;padding:12px 0 14px;margin-top:12px;border-top:1px solid #f5f5f5}
.pd-breadcrumb a{color:#666}
.pd-breadcrumb a:hover{color:var(--jd-red)}
.pd-breadcrumb span{margin:0 6px;color:#ccc}
.cs-host{padding:48px 0 80px;text-align:center;color:#999;font-size:14px}
.cs-host p{margin-top:8px}
</style>
</head>
<body>
<div id="site-topbar-root"></div>
<header class="pd-header">
  <div class="container">
    <div class="pd-header-grid">
      <div class="pd-logo" onclick="location.href=ProtoPages.home">
        <div class="logo-text">苏银豆商城</div>
        <div class="logo-sub">积分好物 · 一站购齐</div>
      </div>
      <div>
        <div class="pd-search">
          <input type="text" placeholder="搜索商品、品牌、品类" id="searchInput">
          <button type="button" id="searchBtn">搜索</button>
        </div>
      </div>
      <div class="pd-cart-col">
        <div class="pd-header-cart" onclick="location.href=ProtoPages.cart">
          <img class="cart-icon-img" src="https://img11.360buyimg.com/img/jfs/t1/299913/28/14314/667/68afc75cFbc268bc7/0b4232db253d0e2a.png" alt="购物车">
          <span>购物车</span>
          <div class="badge" id="headerCartBadge">0</div>
        </div>
      </div>
    </div>
    <nav class="pd-breadcrumb">
      <a href="01.首页-原型页面.html">首页</a><span>›</span><span>在线客服</span>
    </nav>
  </div>
</header>

<div class="container cs-host">
  <div>在线客服窗口已打开</div>
  <p>若未看到弹窗，请 <a href="#" id="csReopen" style="color:#f63218">点击重新打开</a></p>
</div>

<div id="site-footer-root"></div>
<script src="../assets/site-footer.js"></script>
<script src="../assets/proto-pages.js"></script>
<script src="../assets/proto-auth.js"></script>
<script src="../assets/topbar.js"></script>
<script src="../assets/cs-widget.js"></script>
<script src="../assets/float-dock.js"></script>
<script src="../assets/proto-toast.js"></script>
<script>
ProtoAuth.initTopBar({
  cartCount: ProtoAuth.isLogged() ? 15 : 0,
  openLogin: function () { location.href = ProtoPages.login + '?redirect=' + encodeURIComponent(location.href); }
});
FloatDock.init({ cartCount: ProtoAuth.isLogged() ? 15 : 0 });

var headerBadge = document.getElementById('headerCartBadge');
if (headerBadge) headerBadge.textContent = ProtoAuth.isLogged() ? '15' : '0';

document.getElementById('searchBtn').onclick = function () {
  var q = document.getElementById('searchInput').value.trim();
  location.href = q ? ProtoPages.search + '?q=' + encodeURIComponent(q) : ProtoPages.search;
};

var params = new URLSearchParams(location.search);
var csOpts = {
  topic: params.get('topic') || '',
  order: params.get('order') || '',
  product: params.get('product') ? decodeURIComponent(params.get('product')) : '',
  standalone: true
};

ProtoCS.open(csOpts);
document.getElementById('csReopen').onclick = function (e) {
  e.preventDefault();
  ProtoCS.open(csOpts);
};
</script>
</body>
</html>
