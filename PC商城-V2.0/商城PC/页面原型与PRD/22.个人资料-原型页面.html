<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人资料 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/topbar.css">
<link rel="stylesheet" href="../assets/site-footer.css">
<link rel="stylesheet" href="../assets/account-header.css">
<link rel="stylesheet" href="../assets/account-nav.css">
<link rel="stylesheet" href="../assets/proto-icons.css">
<link rel="stylesheet" href="../assets/proto-toast.css">
<link rel="stylesheet" href="../assets/float-dock.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:rgba(0,0,0,.85);background:#f4f4f4;line-height:1.5;min-width:1600px;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select{outline:none;font-family:inherit}
:root{--page-width:1600px;--jd-red:#f63218;--radius:8px;--radius-sm:6px}
.container{width:var(--page-width);margin:0 auto}
.pg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f0f0f0}
.pg-head h1{font-size:18px;font-weight:600}
.pg-edit-btn{height:32px;padding:0 14px;border:1px solid #ddd;border-radius:var(--radius-sm);background:#fff;font-size:13px;color:#666}
.pg-edit-btn:hover{border-color:var(--jd-red);color:var(--jd-red)}
.pg-value{display:block;font-size:14px;padding:10px 0;color:#333;min-height:40px;line-height:20px}
.pg-body.is-editing .pg-value{display:none}
.pg-body:not(.is-editing) .field input,.pg-body:not(.is-editing) .field select{display:none}
.pg-body:not(.is-editing) .pg-avatar-btn{display:none}
.pg-body:not(.is-editing) .pg-form-ft{display:none}
.pg-body:not(.is-editing) .pg-edit-only{display:none}
.pg-body{padding:24px 20px;max-width:640px}
.pg-avatar-row{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid #f0f0f0}
.pg-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f63218,#ff8a65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.pg-avatar-info h4{font-size:15px;margin-bottom:4px}
.pg-avatar-info p{font-size:13px;color:#999}
.pg-avatar-btn{margin-top:8px;height:32px;padding:0 14px;border:1px solid #ddd;border-radius:var(--radius-sm);background:#fff;font-size:13px;color:#666}
.pg-form-row{margin-bottom:18px;display:flex;align-items:flex-start;gap:16px}
.pg-form-row label{width:80px;font-size:14px;color:#666;padding-top:10px;flex-shrink:0}
.pg-form-row .field{flex:1}
.pg-form-row input,.pg-form-row select{width:100%;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:14px;padding:10px 12px}
.pg-form-row .readonly{background:#fafafa;color:#999}
.pg-form-row .hint{font-size:12px;color:#999;margin-top:6px}
.pg-form-ft{margin-top:32px;padding-left:96px}
.pg-btn{height:40px;padding:0 28px;border-radius:var(--radius-sm);font-size:14px;border:1px solid #ddd;background:#fff;color:#666;margin-right:10px}
.pg-btn.primary{background:var(--jd-red);border-color:var(--jd-red);color:#fff}
</style>
</head>
<body>
<div id="site-topbar-root"></div>
<header class="pd-header">
  <div class="container">
    <div class="pd-header-grid">
      <div class="pd-logo" onclick="location.href=ProtoPages.home"><div class="logo-text">苏银豆商城</div><div class="logo-sub">积分好物 · 一站购齐</div></div>
      <div><div class="pd-search"><input type="text" placeholder="搜索商品" id="searchInput"><button type="button" id="searchBtn">搜索</button></div></div>
      <div class="pd-header-cart" onclick="location.href=ProtoPages.cart"><img class="cart-icon-img" src="https://img11.360buyimg.com/img/jfs/t1/299913/28/14314/667/68afc75cFbc268bc7/0b4232db253d0e2a.png" alt=""><span>购物车</span><div class="badge">3</div></div>
    </div>
    <nav class="pd-breadcrumb"><a href="01.首页-原型页面.html">首页</a> &gt; <a href="15.个人中心-原型页面.html">个人中心</a> &gt; <span>个人资料</span></nav>
  </div>
</header>
<div class="container ac-page"><div class="ac-layout"><div id="accountSidebar"></div><div class="ac-main-panel">
<div class="pg-head"><h1>个人资料</h1><button type="button" class="pg-edit-btn" id="editBtn">编辑</button></div>
<div class="pg-body" id="profileBody">
  <div class="pg-avatar-row">
    <div class="pg-avatar" id="avatarText">张</div>
    <div class="pg-avatar-info"><h4 id="displayName">张经理</h4><p>江苏银行 · 企业会员</p><button type="button" class="pg-avatar-btn" onclick="ProtoToast.info('原型演示：头像上传略')">更换头像</button></div>
  </div>
  <div class="pg-form-row"><label>昵称</label><div class="field"><span class="pg-value" id="vNickname">张经理</span><input type="text" id="fNickname" value="张经理"></div></div>
  <div class="pg-form-row"><label>手机号</label><div class="field"><span class="pg-value">138****8888</span><input type="text" class="readonly" value="138****8888" readonly><div class="hint pg-edit-only"><a href="#" style="color:var(--jd-red)" onclick="ProtoToast.info('更换手机号需验证');return false">更换手机号 ›</a></div></div></div>
  <div class="pg-form-row"><label>性别</label><div class="field"><span class="pg-value" id="vGender">男</span><select id="fGender"><option value="保密">保密</option><option value="男" selected>男</option><option value="女">女</option></select></div></div>
  <div class="pg-form-row"><label>生日</label><div class="field"><span class="pg-value" id="vBirth">1990-05-20</span><input type="date" id="fBirth" value="1990-05-20"></div></div>
  <div class="pg-form-row"><label>邮箱</label><div class="field"><span class="pg-value" id="vEmail">zhang@example.com</span><input type="email" id="fEmail" placeholder="选填" value="zhang@example.com"></div></div>
  <div class="pg-form-row"><label>实名认证</label><div class="field"><span class="pg-value">已认证 · 张*理</span><input type="text" class="readonly" value="已认证 · 张*理" readonly><div class="hint">企业福利账户实名信息不可自行修改</div></div></div>
  <div class="pg-form-ft"><button type="button" class="pg-btn" id="cancelBtn">取消</button><button type="button" class="pg-btn primary" id="saveBtn">保存</button></div>
</div>
</div></div></div>
<div id="site-footer-root"></div>
<script src="../assets/site-footer.js"></script>
<script src="../assets/proto-pages.js"></script>
<script src="../assets/proto-auth.js"></script>
<script src="../assets/topbar.js"></script>
<script src="../assets/account-nav.js"></script>
<script src="../assets/proto-icons.js"></script>
<script src="../assets/float-dock.js"></script>
<script src="../assets/proto-toast.js"></script>
<script>
FloatDock.init({ cartCount: 15 });
</script>
<script>
if (!ProtoAuth.guardPage()) void 0;
ProtoAuth.initTopBar({ cartCount: 15 });
AccountNav.renderSidebar('accountSidebar', 'profile');
var profile={nickname:'张经理',gender:'男',birth:'1990-05-20',email:'zhang@example.com'};
function syncView(){
  document.getElementById('vNickname').textContent=profile.nickname;
  document.getElementById('vGender').textContent=profile.gender;
  document.getElementById('vBirth').textContent=profile.birth;
  document.getElementById('vEmail').textContent=profile.email||'未填写';
  document.getElementById('fNickname').value=profile.nickname;
  document.getElementById('fGender').value=profile.gender;
  document.getElementById('fBirth').value=profile.birth;
  document.getElementById('fEmail').value=profile.email;
  document.getElementById('displayName').textContent=profile.nickname;
  document.getElementById('avatarText').textContent=profile.nickname.charAt(0);
}
function setEditMode(on){
  document.getElementById('profileBody').classList.toggle('is-editing',on);
  document.getElementById('editBtn').style.display=on?'none':'';
  if(!on)syncView();
}
document.getElementById('editBtn').onclick=function(){syncView();setEditMode(true);};
document.getElementById('cancelBtn').onclick=function(){setEditMode(false);};
document.getElementById('saveBtn').onclick=function(){
  var nick=document.getElementById('fNickname').value.trim();
  if(!nick){ProtoToast.warn('请输入昵称');return;}
  profile.nickname=nick;
  profile.gender=document.getElementById('fGender').value;
  profile.birth=document.getElementById('fBirth').value;
  profile.email=document.getElementById('fEmail').value.trim();
  syncView();
  setEditMode(false);
  ProtoToast.success('资料已保存');
};
syncView();
document.getElementById('searchBtn').onclick=function(){var q=document.getElementById('searchInput').value.trim();location.href=q?ProtoPages.search+'?q='+encodeURIComponent(q):ProtoPages.search;};
</script>
</body>
</html>
