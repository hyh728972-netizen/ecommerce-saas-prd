<!DOCTYPE html>
<html lang="zh-CN" style="--primary-color:#2e7d32">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌活动 - 苏银豆商城</title>
<link rel="stylesheet" href="../assets/topbar.css">
<link rel="stylesheet" href="../assets/site-footer.css">
<link rel="stylesheet" href="../assets/proto-icons.css">
<link rel="stylesheet" href="../assets/proto-toast.css">
<link rel="stylesheet" href="../assets/float-dock.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans CN",-apple-system,sans-serif;color:var(--text-dark);background:var(--bg-page);line-height:1.5;min-width:var(--page-width);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
ul,li{list-style:none}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input{outline:none;border:none;font-family:inherit}

:root{
  --page-width:1600px;
  --jd-red:#f63218;
  --jd-red-dark:#c81623;
  --price:#ff0f12;
  --price-alt:#f2270c;
  --text-dark:rgba(0,0,0,.85);
  --text-mid:#666;
  --text-light:#999;
  --bg-page:#f4f4f4;
  --border-light:#f0f0f0;
  --radius:8px;
  --radius-sm:6px;
  --radius-lg:12px;
  --shadow-card:0 2px 12px rgba(0,0,0,.06);
  --space-section:16px;
  --space-block:12px;
  --icon-cart:url(https://img11.360buyimg.com/img/jfs/t1/299913/28/14314/667/68afc75cFbc268bc7/0b4232db253d0e2a.png);
  --icon-cart-hover:url(https://img12.360buyimg.com/img/jfs/t1/329610/14/5367/642/68afc86aF292b557f/49aac701bcc27b4f.png);
}

.container{width:var(--page-width);margin:0 auto}

.pd-header{background:#fff;border-bottom:1px solid #eee;padding:16px 0 0}
.pd-header-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:12px;align-items:start}
.pd-logo{cursor:pointer;padding-top:4px}
.pd-logo .logo-text{font-size:32px;font-weight:700;color:var(--jd-red);letter-spacing:1px;line-height:1.15;text-align:center}
.pd-logo .logo-sub{font-size:12px;color:var(--text-mid);margin-top:6px;text-align:center;letter-spacing:.5px}
.pd-search-col{min-width:0}
.pd-search{display:flex;border:2px solid var(--jd-red);border-radius:var(--radius);overflow:hidden;background:#fff}
.pd-search input{flex:1;min-width:0;height:42px;padding:0 16px;font-size:15px}
.pd-search button{width:80px;height:38px;margin:2px;background:var(--jd-red);color:#fff;font-size:15px;font-weight:600;border-radius:var(--radius-sm)}
.search-hot{margin-top:10px;padding-left:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;line-height:1.4}
.search-hot a{font-size:12px;color:var(--text-mid);white-space:nowrap;transition:color .2s}
.search-hot a:hover{color:var(--jd-red)}
.search-hot a.hot-highlight{color:var(--jd-red);font-weight:500}
.pd-cart-col{display:flex;justify-content:flex-end;padding-top:2px}
.pd-header-cart{display:flex;flex-direction:column;align-items:center;gap:4px;color:#333;font-size:12px;cursor:pointer;position:relative;padding:4px 8px;min-width:72px}
.pd-header-cart .cart-icon-img{width:28px;height:28px;object-fit:contain}
.pd-header-cart .badge{position:absolute;top:0;right:4px;min-width:16px;height:16px;background:var(--jd-red);color:#fff;font-size:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
.pd-breadcrumb{font-size:13px;color:var(--text-mid);padding:12px 0 14px;margin-top:12px;border-top:1px solid #f5f5f5;line-height:1.5}
.pd-breadcrumb a{color:var(--text-mid);transition:color .15s}
.pd-breadcrumb a:hover{color:var(--jd-red)}
.pd-breadcrumb span{margin:0 6px;color:#ccc}
.pd-breadcrumb .pd-breadcrumb-current{color:var(--text-dark)}

.act-main{padding:12px 0 24px;display:flex;flex-direction:column;gap:var(--space-section)}

.activity-hero{position:relative;height:320px;border-radius:var(--radius-lg);overflow:hidden;background:#e8e8e8;box-shadow:var(--shadow-card)}
.activity-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.activity-hero-mask{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.25) 45%,transparent 72%)}
.activity-hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 48px;color:#fff;max-width:58%}
.activity-hero-title{font-size:36px;font-weight:700;line-height:1.2;letter-spacing:1px}
.activity-hero-sub{font-size:16px;margin-top:10px;opacity:.92}
.activity-hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.activity-hero-tag{font-size:12px;padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.activity-rule-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:var(--radius);border:1px solid var(--border-light);box-shadow:var(--shadow-card);font-size:13px;color:var(--text-mid)}
.activity-rule-bar svg{width:16px;height:16px;flex-shrink:0;fill:var(--jd-red)}
.activity-rule-bar strong{color:var(--jd-red);font-weight:600;margin-right:4px}

.cat-floors{display:flex;flex-direction:column;gap:var(--space-section)}
.cat-floor{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid var(--border-light);overflow:hidden;scroll-margin-top:12px}
.cat-floor-head{display:flex;justify-content:space-between;align-items:center;padding:10px 11px 8px;border-bottom:1px solid #f5f5f5}
.cat-floor-head h3{font-size:14px;font-weight:600;color:var(--jd-red);letter-spacing:.3px}
.cat-floor-head h3 em{font-style:normal;display:inline-block;min-width:27px;padding:2px 6px;margin-right:8px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--jd-red),var(--price-alt));border-radius:3px;text-align:center;box-shadow:0 2px 6px rgba(246,50,24,.25)}
.cat-floor-head a{font-size:10px;color:var(--text-mid);transition:color .15s}
.cat-floor-head a:hover{color:var(--jd-red)}
.cat-floor-body{display:grid;grid-template-columns:minmax(0,42%) minmax(0,58%);gap:8px;padding:9px;background:linear-gradient(180deg,#fafbfc 0%,#f3f4f6 100%)}
.cat-floor-assembler{display:grid;gap:6px;min-height:0}
.cat-floor-assembler--mix{grid-template-rows:minmax(128px,1.15fr) minmax(94px,.85fr)}
.cat-floor-assembler--stack{grid-template-rows:1fr 1fr}
.cat-floor-assembler-bottom{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
.cat-floor-poster{position:relative;border-radius:8px;overflow:hidden;display:block;border:1px solid transparent;transition:box-shadow .2s;color:inherit}
.cat-floor-poster:hover{box-shadow:0 8px 22px rgba(0,0,0,.08)}
.cat-floor-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cat-floor-poster--hero{min-height:0;height:100%;background:#e8e8e8}
.cat-floor-poster--hero::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.35) 40%,transparent 68%)}
.cat-floor-poster-copy{position:relative;z-index:1;padding:13px 11px 10px;max-width:58%;pointer-events:none}
.cat-floor-poster-copy .cat-floor-brand{font-size:9px;font-weight:700;color:var(--jd-red);letter-spacing:.5px}
.cat-floor-poster-copy strong{display:block;margin-top:5px;font-size:13px;font-weight:700;color:var(--text-dark);line-height:1.25}
.cat-floor-points{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;padding:0;list-style:none}
.cat-floor-points li{font-size:9px;font-weight:500;padding:2px 8px;border-radius:10px;line-height:1.3}
.cat-floor-poster--green .cat-floor-points li{color:#2e7d32;background:rgba(46,125,50,.1);border:1px solid rgba(46,125,50,.22)}
.cat-floor-poster--blue .cat-floor-points li{color:#0958d9;background:rgba(9,88,217,.08);border:1px solid rgba(9,88,217,.18)}
.cat-floor-poster--warm .cat-floor-points li{color:#e65100;background:rgba(230,81,0,.08);border:1px solid rgba(230,81,0,.15)}
.cat-floor-poster--stack{min-height:0;height:100%;border:1px solid #e8e8e8;background:#e8e8e8}
.cat-floor-poster--stack::after{content:'';position:absolute;inset:0;z-index:0}
.cat-floor-poster--mini{min-height:0;height:100%;border:1px solid #e8e8e8;background:#e8e8e8}
.cat-floor-poster--mini::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(255,255,255,.86) 0%,rgba(255,255,255,.3) 42%,transparent 72%)}
.cat-floor-poster-copy--mini{max-width:68%;padding:8px 6px}
.cat-floor-poster-copy--mini strong{font-size:10px;margin-top:3px}
.cat-floor-poster-copy--mini .cat-floor-mini-desc{display:block;font-size:8px;color:var(--text-light);margin-top:2px;line-height:1.3}
.cat-floor-poster--dark::after{background:linear-gradient(90deg,rgba(15,20,35,.72) 0%,rgba(15,20,35,.15) 55%,transparent 100%)}
.cat-floor-poster--office::after{background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.4) 50%,transparent 100%)}
.cat-floor-poster--stack .cat-floor-poster-copy{max-width:52%;height:100%;display:flex;flex-direction:column;justify-content:center}
.cat-floor-poster--dark .cat-floor-poster-copy{color:#fff}
.cat-floor-poster--dark .cat-floor-brand{color:#ff6b6b}
.cat-floor-poster--dark strong{color:#fff}
.cat-floor-poster--stack .cat-floor-poster-copy span{font-size:10px;color:var(--text-mid);margin-top:5px;line-height:1.35}
.cat-floor-poster--dark .cat-floor-poster-copy span{color:rgba(255,255,255,.75)}
.cat-floor-mini-stack{display:flex;flex-direction:column;gap:6px;min-height:0}
.cat-floor-mini-stack .cat-floor-poster--mini{flex:1;min-height:0}
.cat-floor-products{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;min-height:0}
.cat-floor-products .product-card{height:100%;display:flex;flex-direction:column}
.cat-floor-products .product-card-img{flex-shrink:0;aspect-ratio:25/16}
.cat-floor-products .product-card-info{flex:1;display:flex;flex-direction:column;padding:6px 6px 8px}
.cat-floor-products .product-card-name{font-size:12px}
.cat-floor-products .product-card-tags{display:none}
.cat-floor-products .product-card-bottom{margin-top:6px}
.cat-floor-products .price-subsidy{font-size:18px}
.cat-floor-products .price-subsidy em{font-size:12px}
.cat-floor-products .price-origin{font-size:11px}
.cat-floor-products .price-meta{display:none}
.cat-floor-products .cart-add{width:28px;height:28px}
.cat-floor-products .cart-add .cart-icon{width:16px;height:16px}

.act-recommend{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid var(--border-light);overflow:hidden}
.act-recommend-head{padding:14px 16px 10px;border-bottom:1px solid #f5f5f5;font-size:15px;font-weight:600;color:var(--text-dark)}
.act-recommend .product-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-block);padding:16px}
.act-recommend .product-card-name{font-size:12px}
.act-recommend .price-subsidy{font-size:18px}
.act-recommend .price-subsidy em{font-size:12px}
.act-recommend .price-origin{font-size:11px}
.act-recommend .cart-add{width:28px;height:28px}
.act-recommend .cart-add .cart-icon{width:16px;height:16px}
.product-card{cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .2s;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-light);background:#fff}
.product-card:hover{box-shadow:0 6px 20px rgba(246,50,24,.1);border-color:#ffd0d0;transform:translateY(-2px)}
.product-card-img{aspect-ratio:1;background:#f8f8f8;overflow:hidden}
.product-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.product-card-info{padding:8px 8px 10px}
.product-card-name{font-size:13px;color:var(--text-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.product-card-name .brand-tag{color:var(--price-alt);font-weight:600}
.product-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;min-height:18px}
.info-tag{font-size:10px;line-height:16px;padding:0 5px;border-radius:2px;white-space:nowrap}
.info-tag.red{color:var(--price-alt);border:1px solid rgba(242,39,12,.4);background:#fffafa}
.info-tag.green{color:#00a854;border:1px solid rgba(0,168,84,.45)}
.product-card-bottom{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;gap:4px}
.product-card-price-col{flex:1;min-width:0}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price-origin{font-size:12px;color:#999;text-decoration:line-through}
.price-subsidy{font-size:22px;font-weight:700;color:var(--price);line-height:1.1;font-variant-numeric:tabular-nums}
.price-subsidy em{font-size:14px;font-style:normal;font-weight:700;margin-right:1px}
.price-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.subsidy-tip{font-size:11px;color:var(--jd-red)}
.cart-add{width:34px;height:34px;border-radius:var(--radius-sm);background:#fff;border:1px solid #e8e8e8;color:var(--jd-red);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s}
.cart-add .cart-icon{display:block;width:20px;height:20px;background:var(--icon-cart) center/contain no-repeat}
.cart-add:hover{background:#fff;border-color:var(--jd-red)}
.cart-add:hover .cart-icon{background-image:var(--icon-cart-hover)}

.act-empty{text-align:center;padding:80px 20px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.act-empty p{font-size:15px;color:var(--text-mid);margin-bottom:16px}
.act-empty a{display:inline-block;padding:8px 24px;background:var(--jd-red);color:#fff;border-radius:var(--radius-sm);font-size:14px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;width:400px;overflow:hidden;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;justify-content:flex-end;padding:16px 16px 0}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-light);font-size:18px;border-radius:50%}
.modal-close:hover{background:#f5f5f5}
.modal-tabs{display:flex;padding:0 24px;gap:20px;border-bottom:1px solid #eee}
.modal-tab{font-size:15px;color:var(--text-light);cursor:pointer;padding:12px 0;border-bottom:2px solid transparent;margin-bottom:-1px}
.modal-tab.active{color:var(--jd-red);border-bottom-color:var(--jd-red);font-weight:600}
.modal-body{padding:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text-mid);margin-bottom:6px}
.form-input{width:100%;height:42px;border:1px solid #ddd;border-radius:var(--radius-sm);padding:0 12px;font-size:14px}
.form-input:focus{border-color:var(--jd-red)}
.form-row{display:flex;gap:10px}
.form-row .form-input{flex:1}
.sms-btn{width:110px;height:42px;background:#fff;border:1px solid var(--jd-red);color:var(--jd-red);border-radius:var(--radius-sm);font-size:13px}
.modal-submit{width:100%;height:44px;background:var(--jd-red);color:#fff;border-radius:var(--radius-sm);font-size:15px;font-weight:600;margin-top:6px}
</style>
</head>
<body>

<div id="site-topbar-root"></div>

  <div class="container">
    <div class="pd-header-grid">
      <div class="pd-logo" onclick="location.href='01.首页-原型页面.html'">
        <div class="logo-text">苏银豆商城</div>

      </div>

<div class="container act-main" id="actMain">

<script src="../assets/proto-auth.js"></script>

<script src="../assets/proto-icons.js"></script>

<script>
ProtoAuth.initTopBar({
  cartCount: 15,
  openLogin: function () { openLogin(); },
  onLogoutClick: function () { applyUcState('guest'); }
});
FloatDock.init({ cartCount: 15 });
const HOME_PAGE = '01.首页-原型页面.html';
const DETAIL_PAGE = '04.商品详情页-原型页面.html';
const ACTIVITY_PAGE = '02.活动页-原型页面.html';
const ZONE_HUB_PAGE = '02.活动专区页-原型页面.html';

function getProductBrand(name, brand) {
  if (brand) return brand;
  const rules = [[/Apple|Watch/i, '苹果'], [/Nike/i, 'Nike'], [/Sony/i, '索尼'], [/小米/i, '小米']];
  for (const [re, b] of rules) if (re.test(name)) return b;
  const cn = name.match(/^[\u4e00-\u9fa5]{2,4}/);
  return cn ? cn[0] : name.split(/\s/)[0].slice(0, 6);
}

function formatPrice(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function renderInfoTags(tags) {
  const list = (tags || []).filter(Boolean).slice(0, 2);
  if (!list.length) return '';
  return `<div class="product-card-tags">${list.map((t, i) => `<span class="info-tag ${i % 2 ? 'green' : 'red'}">${t}</span>`).join('')}</div>`;
}

function renderProductCard(p, linkable) {
  const brand = getProductBrand(p.name, p.brand);
  const originPrice = p.originPrice || Math.round(p.price * 1.12);
  const subsidy = p.subsidy != null ? p.subsidy : +(originPrice - p.price).toFixed(2);
  const goDetail = linkable ? ` onclick="location.href='${DETAIL_PAGE}'"` : '';
  return `<div class="product-card"${goDetail}>
    <div class="product-card-img"><img src="${p.img}" alt="${p.name}"></div>
    <div class="product-card-info">
      <div class="product-card-name"><span class="brand-tag">【${brand}】</span>${p.name}</div>
      ${renderInfoTags(p.tags)}
      <div class="product-card-bottom">
        <div class="product-card-price-col">
          <div class="price-row">
            <span class="price-origin">¥${formatPrice(originPrice)}</span>
            <span class="price-subsidy"><em>¥</em>${formatPrice(p.price)}</span>
          </div>
          <div class="price-meta"><span class="subsidy-tip">已补贴${formatPrice(subsidy)}元</span></div>
        </div>
        <button class="cart-add" type="button" title="加入购物车" onclick="event.stopPropagation();ProtoToast.show()"><i class="cart-icon"></i></button>
      </div>
    </div>
  </div>`;
}

function renderCatFloorMini(m) {
  return `<a class="cat-floor-poster cat-floor-poster--mini" href="${m.href || '#'}">
    <img src="${m.img}" alt="${m.title}">
    <div class="cat-floor-poster-copy cat-floor-poster-copy--mini">
      <span class="cat-floor-brand">${m.tag}</span>
      <strong>${m.title}</strong>
      <span class="cat-floor-mini-desc">${m.desc}</span>
    </div>
  </a>`;
}

function renderPosterHero(s) {
  const pointsHtml = (s.points || []).map(p => `<li>${p}</li>`).join('');
  return `<a class="cat-floor-poster cat-floor-poster--hero cat-floor-poster--${s.theme || 'green'}" href="${s.href || '#'}">
    <div class="cat-floor-poster-copy">
      <span class="cat-floor-brand">${s.brand}</span>
      <strong>${s.headline}</strong>
      ${pointsHtml ? `<ul class="cat-floor-points">${pointsHtml}</ul>` : ''}
    </div>
    <img src="${s.img}" alt="${s.headline}">
  </a>`;
}

function renderPosterStack(s) {
  return `<a class="cat-floor-poster cat-floor-poster--stack cat-floor-poster--${s.theme || 'dark'}" href="${s.href || '#'}">
    <div class="cat-floor-poster-copy">
      <span class="cat-floor-brand">${s.brand}</span>
      <strong>${s.headline}</strong>
      ${s.sub ? `<span>${s.sub}</span>` : ''}
    </div>
    <img src="${s.img}" alt="${s.headline}">
  </a>`;
}

function renderPosterAsm(asm) {
  if (asm.layout === 'stack') {
    return `<div class="cat-floor-assembler cat-floor-assembler--stack">${asm.slots.map(renderPosterStack).join('')}</div>`;
  }
  const hero = asm.slots.find(s => s.role === 'hero');
  const tall = asm.slots.find(s => s.role === 'tall');
  const wides = asm.slots.filter(s => s.role === 'wide');
  return `<div class="cat-floor-assembler cat-floor-assembler--mix">
    ${renderPosterHero(hero)}
    <div class="cat-floor-assembler-bottom">
      ${tall ? renderCatFloorMini(tall) : ''}
      <div class="cat-floor-mini-stack">${wides.map(renderCatFloorMini).join('')}</div>
    </div>
  </div>`;
}

function renderCatFloor(f) {
  const floorId = 'act-floor-' + f.floor.toLowerCase();
  return `<section class="cat-floor" id="${floorId}" data-floor="${f.floor}">
    <div class="cat-floor-head">
      <h3><em>${f.floor}</em>${f.title}</h3>
      <a href="${f.moreHref || '#'}">查看全部 ›</a>
    </div>
    <div class="cat-floor-body">
      ${renderPosterAsm(f.posterAsm)}
      <div class="cat-floor-products">${f.products.map(p => renderProductCard(p, true)).join('')}</div>
    </div>
  </section>`;
}

let currentFloors = [];

function renderActivityHero(banner) {
  const tagsHtml = (banner.tags || []).map(t => `<span class="activity-hero-tag">${t}</span>`).join('');
  return `<div class="activity-hero">
    <img src="${banner.img}" alt="${banner.title}">
    <div class="activity-hero-mask"></div>
    <div class="activity-hero-copy">
      <h1 class="activity-hero-title">${banner.title}</h1>
      <p class="activity-hero-sub">${banner.sub}</p>
      ${tagsHtml ? `<div class="activity-hero-tags">${tagsHtml}</div>` : ''}
    </div>
  </div>`;
}

function renderActivityRule(rule) {
  if (!rule) return '';
  return `<div class="activity-rule-bar">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <span><strong>活动规则</strong>${rule}</span>
  </div>`;
}

function renderRecommend(list) {
  return `<div class="act-recommend-head">为你推荐</div>
    <div class="product-grid">${list.map(p => renderProductCard(p, true)).join('')}</div>`;
}

function initActivityPage() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'apple-wear';
  const page = ACTIVITY_PAGES[id];

  if (!page) {
    document.getElementById('actMain').style.display = 'none';
    document.getElementById('actEmpty').style.display = '';
    document.title = '活动不存在 - 苏银豆商城';
    return;
  }

  document.title = `${page.banner.title} - 品牌活动 - 苏银豆商城`;

  document.getElementById('actBreadcrumb').innerHTML =
    `<a href="${HOME_PAGE}">首页</a><span>›</span><a href="${ZONE_HUB_PAGE}#${id.indexOf('welfare-') === 0 ? 'welfare' : 'brand'}">活动专区</a><span>›</span><span class="pd-breadcrumb-current">${page.banner.title}</span>`;

  document.getElementById('actHero').innerHTML = renderActivityHero(page.banner);
  document.getElementById('actRule').innerHTML = renderActivityRule(page.rule);

  currentFloors = page.floors;
  document.getElementById('actFloors').innerHTML = page.floors.map(renderCatFloor).join('');

  document.getElementById('actRecommend').innerHTML = renderRecommend(page.recommend.slice(0, 12));
  FloatDock.bindFloorNav({
    getFloors: () => currentFloors.map(f => ({
      floor: f.floor,
      title: f.title,
      id: 'act-floor-' + f.floor.toLowerCase()
    }))
  });
}

initActivityPage();

const UC_USER = { name: '张经理', cartCount: 15 };

function applyUcState(state) {
  const logged = state === 'logged';
  const headerBadge = document.getElementById('headerCartBadge');
  if (typeof SiteTopBar !== 'undefined') {
    SiteTopBar.setLogged(logged, { userName: UC_USER.name, cartCount: logged ? UC_USER.cartCount : 0 });
  }
  if (headerBadge) headerBadge.textContent = logged ? '3' : '0';
  if (typeof FloatDock !== 'undefined') FloatDock.setCartCount(logged ? UC_USER.cartCount : 0);
  if (logged) ProtoAuth.login({ userName: UC_USER.name, cartCount: UC_USER.cartCount });
  else ProtoAuth.logout();
}
applyUcState(ProtoAuth.isLogged() ? 'logged' : 'guest');

const SEARCH_PAGE = '03.搜索分类页-原型页面.html';
function goToSearchPage(q) {
  const kw = (q || document.getElementById('searchInput').value || '').trim();
  if (!kw) return;
  location.href = SEARCH_PAGE + '?q=' + encodeURIComponent(kw);
}
document.getElementById('searchBtn').addEventListener('click', () => goToSearchPage());
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') goToSearchPage(); });
document.querySelectorAll('.search-hot a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    goToSearchPage(a.textContent.trim());
  });
});

document.getElementById('loginModal').addEventListener('click', e => {
  if (e.target.id === 'loginModal') closeLogin();
  if (e.target.classList.contains('modal-submit')) {
    ProtoAuth.login({ userName: UC_USER.name, cartCount: UC_USER.cartCount });
    applyUcState('logged');
    closeLogin();
  }
});

function openLogin() { document.getElementById('loginModal').classList.add('active'); }
function closeLogin() { document.getElementById('loginModal').classList.remove('active'); }

function switchLoginTab(el, type) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const body = document.getElementById('loginBody');
  if (type === 'wechat') {
    body.innerHTML = '<div style="text-align:center;padding:24px 0"><div style="width:160px;height:160px;background:#f5f5f5;border-radius:8px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#999;border:1px dashed #ddd">扫码登录</div><p style="font-size:14px;color:#666">微信扫码登录</p></div>';
  } else {
    body.innerHTML = '<div class="form-group"><label>手机号</label><input class="form-input" type="tel" placeholder="请输入手机号" maxlength="11"></div><div class="form-group"><label>验证码</label><div class="form-row"><input class="form-input" type="text" placeholder="请输入验证码" maxlength="6"><button class="sms-btn">获取验证码</button></div></div><button class="modal-submit">登 录</button>';
  }
}

</script>
</body>
</html>
