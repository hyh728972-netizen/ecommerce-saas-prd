<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城数据看板 - 商城运营后台</title>
    <link rel="stylesheet" href="base.css">
    <style>
        /* ===== 首页两栏布局：左主区 + 右侧栏 ===== */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
            align-items: start;
        }
        .dashboard-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .dashboard-side { display: flex; flex-direction: column; gap: 16px; }
        @media (max-width: 1200px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        /* ===== 商品销量排行表格 ===== */
        .product-rank-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .product-rank-table th { text-align: left; padding: 10px 12px; background: #fafafa; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border-color); }
        .product-rank-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; color: var(--text-color); }
        .product-rank-table tr:last-child td { border-bottom: none; }
        .product-rank-table .rank-num { font-weight: 600; color: var(--text-secondary); }
        .product-rank-table .rank-top { color: #ff4d4f; }

        /* ===== 常用功能（缩小版，4列紧凑网格） ===== */
        .func-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius, 8px); padding: 12px; display: flex; flex-direction: column; }
        .func-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .func-header .section-title { margin-bottom: 0; }
        .func-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; flex: 1; }
        .func-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            padding: 6px 2px; border-radius: 8px; cursor: pointer; transition: all 0.3s; text-align: center; min-width: 0;
        }
        .func-item:hover { background: #f5f9ff; }
        .func-icon {
            width: 36px; height: 36px; border-radius: 50%; background: #e6f7ff; color: var(--primary-color);
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
        }
        .func-item:hover .func-icon { background: var(--primary-color); color: #fff; }
        .func-name { font-size: 12px; color: var(--text-color); line-height: 1.2; }
        .func-add {
            width: 22px; height: 22px; border-radius: 50%; border: 1px solid #d9d9d9;
            background: #fff; color: var(--text-secondary); font-size: 16px; line-height: 1;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; flex-shrink: 0;
        }
        .func-add:hover { border-color: var(--primary-color); color: var(--primary-color); background: #e6f7ff; }

        /* ===== 待办事项（列表形式） ===== */
        .todo-list { display: flex; flex-direction: column; }
        .todo-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid #f0f0f0; cursor: default;
        }
        .todo-list-item:last-child { border-bottom: none; }
        .todo-list-item.clickable { cursor: pointer; }
        .todo-list-item.clickable:hover .todo-list-title { color: var(--primary-color); }
        .todo-list-item.disabled .todo-list-title { color: var(--text-tertiary); }
        .todo-list-title { font-size: 13px; color: var(--text-color); flex: 1; }
        .todo-list-count { font-size: 15px; font-weight: 600; color: var(--text-color); }
        .todo-list-item.clickable .todo-list-count { color: var(--primary-color); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 0;
        }
        .metric-mini {
            min-height: 92px;
        }
        .metric-mini .metric-value {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .metrics-filter {
            margin-left: auto;
        }
        .metrics-filter .panel-select {
            height: 28px;
            font-size: 12px;
            min-width: 100px;
        }
        .channel-search-wrapper { position: relative; display: inline-block; }
        .channel-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100; max-height: 200px; overflow-y: auto; display: none; }
        .channel-dropdown.show { display: block; }
        .channel-dropdown-item { padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .channel-dropdown-item:hover { background: #f5f5f5; }
        .channel-dropdown-item.selected { background: #e6f7ff; color: #1890ff; }
        .channel-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .channel-tag { display: inline-flex; align-items: center; padding: 2px 8px; background: #e6f7ff; color: #1890ff; border-radius: 4px; font-size: 12px; }
        .channel-tag .remove-tag { margin-left: 4px; cursor: pointer; }
        /* 筛选区 */
        .filter-bar { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: var(--card-bg); padding: 14px 24px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-label { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
        .filter-bar .panel-select { min-width: 150px; }
        .filter-summary { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }
    </style>
</head>

                <div class="subtitle">运营管理系统</div>
            </div>
            <div class="sider-menu">
                <div class="menu-item active">首页</div>
            </div>
        </aside>

                <div class="tab-item">商品类目 <span class="tab-close">×</span></div>
                <div class="tab-item">商品列表 <span class="tab-close">×</span></div>
                <div class="tab-item active" id="task-tab" style="display:none;"></div>

                    </div>
                    <div class="filter-group">
                        <span class="filter-label">经营模式</span>
                        <select class="panel-select" id="filter-mode">
                            <option value="all">全部</option>
                            <option value="direct">直销</option>
                            <option value="distributor">分销</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">终端</span>
                        <select class="panel-select" id="filter-terminal">
                            <option value="all">全部</option>
                        </select>
                    </div>
                    <span class="filter-summary" id="filter-summary"></span>
                </div>

                <!-- 两栏布局：左主区(指标/趋势/排行) + 右侧栏(功能/待办/未推品) -->
                <div class="dashboard-layout">
                    <!-- ===== 左主区：关键指标 + 订单趋势 + 商品销量排行 ===== -->
                    <div class="dashboard-main">
                        <section class="metrics-section">
                            <div class="section-title" style="margin-bottom: 12px;">关键指标</div>
                            <div class="metrics-grid" id="metrics-grid"></div>
                        </section>

                        <section class="card">
                            <div class="panel-header">
                                <div><div class="panel-title">订单趋势</div></div>
                                <div class="panel-tools">
                                    <select class="panel-select" id="order-trend-period-select">
                                        <option value="day">自然日</option>
                                        <option value="month">自然月</option>
                                        <option value="quarter">季度</option>
                                        <option value="year">年</option>
                                    </select>
                                    <span id="date-range-container">
                                        <input type="date" class="panel-date" id="order-trend-start-date"> -
                                        <input type="date" class="panel-date" id="order-trend-end-date">
                                    </span>
                                </div>
                            </div>
                            <div class="chart-area">
                                <svg class="chart-svg" id="order-trend-chart" viewBox="0 0 800 360" preserveAspectRatio="none"></svg>
                            </div>
                            <div class="legend" style="text-align: center; margin-top: 8px;">
                                <span style="margin-right: 20px;"><span style="display: inline-block; width: 12px; height: 12px; background: #1890ff; opacity: 0.6; margin-right: 4px; vertical-align: middle;"></span>支付订单数</span>
                                <span><span style="display: inline-block; width: 12px; height: 12px; background: #ff4d4f; margin-right: 4px; vertical-align: middle;"></span>产生订单金额</span>
                                <span id="channel-remark" style="margin-left: 20px; color: #8c8c8c; font-size: 12px;">全部渠道</span>
                            </div>
                        </section>

                        <section class="card" id="product-rank-card">
                            <div class="panel-header">
                                <div><div class="panel-title">商品销量排行</div></div>
                            </div>
                            <table class="product-rank-table" id="product-rank-table">
                                <thead><tr><th>排名</th><th>商品信息</th><th>商品编号</th><th>商品分类</th><th>销量</th><th>销售额</th></tr></thead>
                                <tbody id="product-rank-body"></tbody>
                            </table>
                        </section>
                    </div>

                    <!-- ===== 右侧栏：常用功能 + 待办事项 + 近期未推品渠道 ===== -->
                    <div class="dashboard-side">
                        <section class="func-card">
                            <div class="func-header">
                                <div class="section-title">常用功能</div>
                                <div class="func-add" id="manage-shortcuts-button-side" title="添加常用功能">+</div>
                            </div>
                            <div class="func-grid" id="func-grid"></div>
                        </section>

                        <section class="card">
                            <div class="section-title" style="padding: 4px 0 12px 12px;">待办事项</div>
                            <div class="todo-list" id="todo-grid"></div>
                        </section>

                        <section class="card" id="no-product-card">
                            <div class="panel-header">
                                <div><div class="panel-title">近期未推品渠道</div></div>
                            </div>
                            <div style="font-size: 12px; color: #8c8c8c; margin-bottom: 8px;">时间范围：大于7天</div>
                            <table class="channel-compare-table">
                                <thead><tr><th>渠道</th><th>未推品天数</th></tr></thead>
                                <tbody id="no-product-table-body">
                                    <tr><td>渠道3</td><td>15天</td></tr>
                                    <tr><td>渠道7</td><td>14天</td></tr>
                                    <tr><td>渠道5</td><td>12天</td></tr>
                                    <tr><td>渠道2</td><td>10天</td></tr>
                                    <tr><td>渠道9</td><td>8天</td></tr>
                                    <tr><td>渠道1</td><td>7天</td></tr>
                                </tbody>
                            </table>
                        </section>
                    </div>
                </div>

                <div class="page-view hidden" id="task-page">
                    <div class="task-page">
                        <div class="task-header">
                            <div>
                                <div class="task-title" id="task-page-title">问题处理页</div>
                                <div class="task-desc" id="task-page-desc">进入对应问题处理页面后，可直接筛选、查看并处理待办任务。</div>
                            </div>
                            <button class="btn btn-default" type="button" id="back-dashboard-button">返回首页看板</button>
                        </div>

                        <div class="task-toolbar">
                            <div class="task-filters">
                                <input class="task-filter" id="task-filter-keyword" type="text" placeholder="请输入关键词">
                                <select class="task-filter" id="task-filter-status"><option>全部状态</option></select>
                            </div>
                            <div class="task-actions">
                                <button class="btn btn-primary" type="button">查询</button>
                                <button class="btn btn-default" type="button">重置</button>
                            </div>
                        </div>

                        <div class="table-wrapper">
                            <table class="table">
                                <thead><tr id="task-table-head"></tr></thead>
                                <tbody id="task-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="shortcut-modal">
        <div class="modal">
            <div class="modal-header">

                <button class="modal-close" type="button" id="shortcut-modal-close">×</button>

            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="button" id="shortcut-save-button">保存</button>
            </div>
        </div>
    </div>

        // 初始化日期选择器
        function initDaySelector() {
            const today = new Date();
            // 不包含当天，默认结束日期为昨天
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const thirtyDaysAgo = new Date(yesterday);
            thirtyDaysAgo.setDate(yesterday.getDate() - 30);

            const startDateInput = document.getElementById('order-trend-start-date');
            const endDateInput = document.getElementById('order-trend-end-date');

            if (startDateInput && endDateInput) {
                startDateInput.value = thirtyDaysAgo.toISOString().split('T')[0];
                endDateInput.value = yesterday.toISOString().split('T')[0];

                // 设置日期范围限制（不包含当天）
                startDateInput.max = yesterday.toISOString().split('T')[0];
                endDateInput.min = thirtyDaysAgo.toISOString().split('T')[0];
                endDateInput.max = yesterday.toISOString().split('T')[0];
                startDateInput.min = '2023-01-01';

                // 起始日期变化时限制结束日期并刷新图表
                startDateInput.addEventListener('change', function() {
                    const start = new Date(this.value);
                    const maxEnd = new Date(start);
                    maxEnd.setDate(start.getDate() + 30);
                    const maxEndStr = maxEnd.toISOString().split('T')[0];
                    const yesterdayStr = yesterday.toISOString().split('T')[0];
                    endDateInput.max = maxEndStr > yesterdayStr ? yesterdayStr : maxEndStr;

                    // 如果结束日期超出范围，自动调整
                    if (new Date(endDateInput.value) > maxEnd) {
                        endDateInput.value = maxEndStr > yesterdayStr ? yesterdayStr : maxEndStr;
                    }
                    endDateInput.min = this.value;
                    // 立即刷新图表
                    renderOrderTrendChart();
                });

                // 结束日期变化时限制起始日期并刷新图表
                endDateInput.addEventListener('change', function() {
                    const end = new Date(this.value);
                    const minStart = new Date(end);
                    minStart.setDate(end.getDate() - 30);
                    const minStartStr = minStart.toISOString().split('T')[0];
                    const startMinStr = '2023-01-01';
                    startDateInput.min = minStartStr;

                    // 如果起始日期超出范围，自动调整
                    if (new Date(startDateInput.value) < minStart) {
                        startDateInput.value = minStartStr;
                    }
                    startDateInput.max = this.value;
                    // 立即刷新图表
                    renderOrderTrendChart();
                });
            }
        }

        // 初始化季度选择器
        function initQuarterSelector() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentQuarter = Math.floor((today.getMonth() + 3) / 3);
            // 包含当前季度

            const startSelect = document.getElementById('order-trend-start-quarter');
            const endSelect = document.getElementById('order-trend-end-quarter');

            if (startSelect && endSelect) {
                // 生成从2023年开始的季度选项（包含当前季度）
                const startYear = 2023;
                let options = '';
                for (let year = currentYear; year >= startYear; year--) {
                    for (let q = (year === currentYear ? currentQuarter : 4); q >= 1; q--) {
                        const value = `${year}Q${q}`;
                        options += `<option value="${value}">${value}</option>`;
                    }
                }
                startSelect.innerHTML = options;
                endSelect.innerHTML = options;

                // 设置默认值（包含当前季度）
                const fourQuartersAgo = new Date(currentYear, currentQuarter * 3 - 12, 1);
                let defaultStartQ = `${fourQuartersAgo.getFullYear()}Q${Math.floor((fourQuartersAgo.getMonth() + 3) / 3)}`;
                startSelect.value = defaultStartQ;
                endSelect.value = `${currentYear}Q${currentQuarter}`;

                // 限制选择范围（包含当前季度）
                startSelect.addEventListener('change', function() {
                    const [startYear, startQ] = [parseInt(this.value), parseInt(this.value.slice(-1))];
                    const startDate = new Date(startYear, (startQ - 1) * 3, 1);
                    const maxEndDate = new Date(startDate.getFullYear(), startDate.getMonth() + 12, 1);

                    // 重新生成结束季度选项（包含当前季度）
                    let endOptions = '';
                    for (let year = currentYear; year >= startYear; year--) {
                        for (let q = (year === currentYear ? currentQuarter : 4); q >= 1; q--) {
                            const qDate = new Date(year, (q - 1) * 3, 1);
                            if (qDate <= maxEndDate) {
                                const value = `${year}Q${q}`;
                                endOptions += `<option value="${value}">${value}</option>`;
                            }
                        }
                    }
                    endSelect.innerHTML = endOptions;
                    if (new Date(endSelect.value) > maxEndDate) {
                        endSelect.value = endSelect.options[endSelect.options.length - 1].value;
                    }
                    renderOrderTrendChart();
                });

                endSelect.addEventListener('change', function() {
                    const [endYear, endQ] = [parseInt(this.value), parseInt(this.value.slice(-1))];
                    const endDate = new Date(endYear, (endQ - 1) * 3, 1);
                    const minStartDate = new Date(endDate.getFullYear(), endDate.getMonth() - 12, 1);

                    // 重新生成起始季度选项（包含当前季度）
                    let startOptions = '';
                    for (let year = currentYear; year >= startYear; year--) {
                        for (let q = (year === currentYear ? currentQuarter : 4); q >= 1; q--) {
                            const qDate = new Date(year, (q - 1) * 3, 1);
                            if (qDate >= minStartDate) {
                                const value = `${year}Q${q}`;
                                startOptions += `<option value="${value}">${value}</option>`;
                            }
                        }
                    }
                    startSelect.innerHTML = startOptions;
                    if (new Date(startSelect.value) < minStartDate) {
                        startSelect.value = startSelect.options[0].value;
                    }
                    renderOrderTrendChart();
                });
            }
        }

        // 初始化年份选择器

            const startSelect = document.getElementById('order-trend-start-year');
            const endSelect = document.getElementById('order-trend-end-year');

            if (startSelect && endSelect) {
                // 生成年份选项（从2023年开始，包含今年）

                const startYear = 2023;
                let options = '';
                for (let year = currentYear; year >= startYear; year--) {
                    options += `<option value="${year}">${year}年</option>`;
                }
                startSelect.innerHTML = options;
                endSelect.innerHTML = options;

                // 设置默认值（包含今年）
                startSelect.value = startYear;
                endSelect.value = currentYear;

                // 年份变化时触发重新渲染
                startSelect.addEventListener('change', function() {
                    if (parseInt(this.value) > parseInt(endSelect.value)) {
                        endSelect.value = this.value;
                    }
                    renderOrderTrendChart();
                });

                endSelect.addEventListener('change', function() {
                    if (parseInt(this.value) < parseInt(startSelect.value)) {
                        startSelect.value = this.value;
                    }
                    renderOrderTrendChart();
                });
            }
        }

        function refreshTerminalFilterOptions() {
            const select = document.getElementById('filter-terminal');
            const tMap = { miniapp: '小程序商城', pc: 'PC端商城', h5: 'H5商城' };
            let available;
            if (selectedBrandMall !== 'all') {

                const mall = brandMallData.find(m => m.id === selectedBrandMall);
                available = mall ? [mall.terminal] : [];
            } else {
                // 全部商城：取平台下实际有商城开通的终端类型
                available = Array.from(new Set(brandMallData.map(m => m.terminal)));
            }
            const options = ['<option value="all">全部</option>']
                .concat(available.map(t => `<option value="${t}">${tMap[t]}</option>`));
            select.innerHTML = options.join('');
            select.disabled = (selectedBrandMall !== 'all'); // 下钻后锁定不可切换

            if (!available.includes(selectedTerminal) && selectedTerminal !== 'all') {
                selectedTerminal = 'all';
                select.value = 'all';
            } else {
                select.value = selectedTerminal;
            }

        function getFilteredMalls() {
            let malls = brandMallData.slice();
            if (selectedBrandMall !== 'all') malls = malls.filter(m => m.id === selectedBrandMall);
            if (selectedMode !== 'all') malls = malls.filter(m => m.mode === selectedMode);
            if (selectedTerminal !== 'all') malls = malls.filter(m => m.terminal === selectedTerminal);
            return malls;
        }

        function zeroMetrics() { return { orderCount: 0, orderAmount: 0, newProduct: 0 }; }

        function pickMetrics(mall) {
            return mall.metrics || zeroMetrics();
        }

        function aggregateMetrics(malls) {
            const sum = zeroMetrics();
            malls.forEach(m => {
                const d = pickMetrics(m);
                sum.orderCount += d.orderCount;
                sum.orderAmount += d.orderAmount;
                sum.newProduct += d.newProduct;
            });
            return sum;
        }

        function aggregateTodos(malls) {
            const sum = { orderSyncFail: 0, priceAudit: 0, supplierAudit: 0, untagged: 0, afterSale: 0 };
            malls.forEach(m => Object.keys(sum).forEach(k => sum[k] += (m.todos[k] || 0)));
            return sum;
        }

        function aggregateTrendMonthly(malls) {
            const volume = new Array(12).fill(0);
            const amount = new Array(12).fill(0);
            malls.forEach(m => {
                const tr = m.trend;
                tr.volume.forEach((v, i) => volume[i] += v);
                tr.amount.forEach((v, i) => amount[i] += Number(v));
            });
            return { volume, amount };
        }

        function computeTrendScale(malls) {
            const cur = aggregateTrendMonthly(malls).volume.reduce((s, v) => s + v, 0);
            const def = orderTrendData.month.volume.reduce((s, v) => s + v, 0);
            return def ? cur / def : 0;
        }

        function aggregateNoProduct(malls) {
            const map = {};
            malls.forEach(m => m.noProductChannels.forEach(c => { map[c.name] = Math.max(map[c.name] || 0, c.days); }));
            return Object.keys(map).map(name => ({ name, days: map[name] })).sort((a, b) => b.days - a.days);
        }

        function renderTodos(malls) {
            const sum = aggregateTodos(malls);
            const cards = [
                { title: '订单同步失败', count: sum.orderSyncFail, task: 'order_sync_fail', enabled: true },
                { title: '调价待审核', count: sum.priceAudit, task: '', enabled: false },
                { title: '指定供应商待审核数量', count: sum.supplierAudit, task: '', enabled: false },
                { title: '未打标签数量', count: sum.untagged, task: '', enabled: false },
                { title: '售后订单', count: sum.afterSale, task: 'new_product', enabled: true },
            ];
            const container = document.getElementById('todo-grid');
            container.innerHTML = cards.map(c => `
                <div class="todo-list-item ${c.enabled ? 'clickable' : 'disabled'}" ${c.enabled ? `data-task-page="${c.task}"` : ''}>
                    <div class="todo-list-title">${c.title}</div>
                    <div class="todo-list-count">${c.count}</div>
                </div>
            `).join('');
            container.querySelectorAll('[data-task-page]').forEach(card => {
                card.addEventListener('click', () => openTaskPage(card.getAttribute('data-task-page')));
            });
        }

                    <div class="metric-value">${it.value}</div>
                    <div class="metric-sub">${it.sub}</div>
                </div>
            `).join('');
        }

        // 商品销量排行：按筛选范围汇总，销量随渠道数等比缩放
        function renderProductRank(malls) {
            const scale = malls.length / brandMallData.length; // 当前筛选占比
            const body = document.getElementById('product-rank-body');
            body.innerHTML = productRankDataBase.map((p, i) => {
                const sales = Math.max(0, Math.round(p.sales * scale));
                const amount = Math.max(0, Math.round(p.amount * scale));
                const rankClass = i < 3 ? 'rank-num rank-top' : 'rank-num';
                return `<tr>
                    <td class="${rankClass}">${i + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.code}</td>
                    <td>${p.category}</td>
                    <td>${sales.toLocaleString()}</td>
                    <td>¥${amount.toLocaleString()}</td>
                </tr>`;
            }).join('');
        }

        function updateFilterSummary(malls) {
            const modeText = selectedMode === 'all' ? '全部模式' : (selectedMode === 'direct' ? '直销' : '分销');

        function applyFilters() {
            // 选中具体商城后，终端/模式筛选器锁定为该商城属性
            if (selectedBrandMall !== 'all') {
                const mall = brandMallData.find(m => m.id === selectedBrandMall);
                if (mall) {
                    selectedTerminal = mall.terminal;
                    selectedMode = mall.mode;
                }
            }
            const malls = getFilteredMalls();
            updateFilterSummary(malls);
            renderTodos(malls);
            renderMetrics(malls);
            renderProductRank(malls);
            // 选具体渠道时隐藏未推品渠道表（只看一个渠道时该表无意义）
            const noProductCard = document.getElementById('no-product-card');
            if (selectedBrandMall !== 'all') {
                noProductCard.style.display = 'none';
            } else {
                noProductCard.style.display = '';
                renderNoProduct(malls);
            }
            // 更新订单趋势图例的渠道备注
            const remark = document.getElementById('channel-remark');
            if (remark) remark.textContent = selectedBrandMall === 'all' ? '全部渠道' : ((malls[0] && malls[0].name) || '全部渠道');
            renderOrderTrendChart();
        }

        // 渲染订单趋势图（合并柱状图+折线图）
        function renderOrderTrendChart() {
            const period = document.getElementById('order-trend-period-select').value;

            // 获取数据：根据周期类型、渠道/模式/终端筛选
            let data;
            if (period === 'month') {
                // 月度 + 渠道/模式/终端筛选维度
                const agg = aggregateTrendMonthly(getFilteredMalls());
                data = { labels: monthLabels, volume: agg.volume, amount: agg.amount.map(v => v.toFixed(1)) };
            } else {
                // 其他周期：按当前聚合规模相对默认规模缩放，体现筛选带来的数值变化
                const scale = computeTrendScale(getFilteredMalls());
                const base = orderTrendData[period];
                data = {
                    labels: base.labels,
                    volume: base.volume.map(v => Math.max(0, Math.round(v * scale))),
                    amount: base.amount.map(Number).map(v => (v * scale).toFixed(1))
                };
            }

            // 根据周期类型获取日期值
            let startDate, endDate;
            if (period === 'day') {
                startDate = document.getElementById('order-trend-start-date')?.value;
                endDate = document.getElementById('order-trend-end-date')?.value;
            } else if (period === 'month') {
                startDate = document.getElementById('order-trend-start-month')?.value;
                endDate = document.getElementById('order-trend-end-month')?.value;
            } else if (period === 'quarter') {
                startDate = document.getElementById('order-trend-start-quarter')?.value;
                endDate = document.getElementById('order-trend-end-quarter')?.value;
            } else if (period === 'year') {
                startDate = document.getElementById('order-trend-start-year')?.value;
                endDate = document.getElementById('order-trend-end-year')?.value;
            }

            const left = 60;
            const right = 60;
            const top = 24;
            const bottom = 42;
            const width = 800;
            const height = 360;
            const usableWidth = width - left - right;
            const usableHeight = height - top - bottom;

            const maxVolume = Math.max(...data.volume) * 1.2;
            const maxAmount = Math.max(...data.amount) * 1.2;

            let svgContent = '<g stroke="#f0f0f0" stroke-width="1">';
            for (let i = 0; i <= 4; i++) {
                const y = top + (usableHeight / 4) * i;
                svgContent += `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>`;
            }
            svgContent += '</g>';

            // 柱状图 - 订单量（蓝色）
            const barWidth = (usableWidth / data.labels.length) * 0.5;
            data.volume.forEach((value, index) => {
                const x = left + (usableWidth / data.labels.length) * index + (usableWidth / data.labels.length - barWidth) / 2;
                const barHeight = (value / maxVolume) * usableHeight;
                svgContent += `<rect x="${x}" y="${top + usableHeight - barHeight}" width="${barWidth}" height="${barHeight}" fill="#1890ff" opacity="0.6"></rect>`;
            });

            // 折线图 - 订单金额（红色）
            const linePath = data.amount.map((value, index) => {
                const x = left + (usableWidth / data.labels.length) * index + (usableWidth / data.labels.length) / 2;
                const y = top + usableHeight - (value / maxAmount) * usableHeight;
                return `${index === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');
            svgContent += `<path d="${linePath}" stroke="#ff4d4f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>`;

            // 数据点 - 订单金额
            data.amount.forEach((value, index) => {
                const x = left + (usableWidth / data.labels.length) * index + (usableWidth / data.labels.length) / 2;
                const y = top + usableHeight - (value / maxAmount) * usableHeight;
                svgContent += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#ff4d4f"></circle>`;
            });

            // 左侧Y轴 - 订单量
            svgContent += '<g fill="#1890ff" font-size="12" font-family="Arial, sans-serif" text-anchor="end">';
            for (let i = 0; i <= 4; i++) {
                const y = top + (usableHeight / 4) * i;
                const value = Math.round(maxVolume - (maxVolume / 4) * i);
                svgContent += `<text x="${left - 8}" y="${y + 4}">${value}</text>`;
            }
            svgContent += '</g>';

            // 右侧Y轴 - 订单金额
            svgContent += '<g fill="#ff4d4f" font-size="12" font-family="Arial, sans-serif" text-anchor="start">';
            for (let i = 0; i <= 4; i++) {
                const y = top + (usableHeight / 4) * i;
                const value = (maxAmount - (maxAmount / 4) * i).toFixed(1);
                svgContent += `<text x="${width - right + 8}" y="${y + 4}">${value}万</text>`;
            }
            svgContent += '</g>';

            // X轴标签
            svgContent += '<g fill="#8c8c8c" font-size="12" font-family="Arial, sans-serif" text-anchor="middle">';
            data.labels.forEach((label, index) => {
                const x = left + (usableWidth / data.labels.length) * index + (usableWidth / data.labels.length) / 2;
                svgContent += `<text x="${x.toFixed(1)}" y="${height - 12}">${label}</text>`;
            });
            svgContent += '</g>';

            document.getElementById('order-trend-chart').innerHTML = svgContent;
        }

        function bindDashboardPanelEvents() {
            // 多维度筛选器联动
            document.getElementById('filter-brand-mall').addEventListener('change', function() {
                selectedBrandMall = this.value;
                // 切换渠道后，终端/模式筛选器可选项按是否下钻刷新
                refreshTerminalFilterOptions();
                applyFilters();
            });
            document.getElementById('filter-mode').addEventListener('change', function() {
                selectedMode = this.value;
                applyFilters();
            });
            document.getElementById('filter-terminal').addEventListener('change', function() {
                selectedTerminal = this.value;
                applyFilters();
            });
            document.getElementById('order-trend-period-select').addEventListener('change', function() {
                updateDateSelectors(this.value);
                renderOrderTrendChart();
            });

            // 渠道（品牌商城）维度已上移至顶部全局筛选器，此处不再单独搜索
        }

        // ===== 常用功能（本地化重写，复用 shortcutOptions 数据，不动 base.js） =====
        // 给每个功能项配一个图标字符（简易视觉区分）
        const funcIcons = {
            pending_review: '审', product_publish: '发', draft_box: '稿', after_sales: '售',
            order_center: '单', inventory_warning: '库', supplier_list: '供', supplier_review: '核',
            supplier_category: '类'
        };
        function renderFuncGrid() {
            const container = document.getElementById('func-grid');
            const visibleItems = selectedShortcutKeys.map(getShortcutItem).filter(Boolean);
            container.innerHTML = visibleItems.map((item) => `
                <div class="func-item" data-shortcut-key="${item.key}">
                    <div class="func-icon">${funcIcons[item.key] || '·'}</div>
                    <div class="func-name">${item.name}</div>
                </div>
            `).join('');
            // 点击进入对应业务页（此处仅占位交互）
            container.querySelectorAll('[data-shortcut-key]').forEach((el) => {
                el.addEventListener('click', () => {
                    // TODO: 跳转到对应业务页面
                });
            });
        }
        // 侧栏「添加常用功能」按钮 → 复用原弹窗
        function bindFuncAddButton() {
            const btn = document.getElementById('manage-shortcuts-button-side');
            if (btn) btn.addEventListener('click', openShortcutModal);
        }

        renderFuncGrid();
        bindFuncAddButton();
        bindShortcutEvents();
        // 覆盖弹窗保存行为：保存后刷新常用功能网格（base.js 默认调 renderQuickNav，此处容器已不存在）
        const saveBtn = document.getElementById('shortcut-save-button');
        if (saveBtn) {
            const fresh = saveBtn.cloneNode(true);
            saveBtn.parentNode.replaceChild(fresh, saveBtn);
            fresh.addEventListener('click', () => {
                selectedShortcutKeys = [...draftShortcutKeys];
                renderFuncGrid();
                closeShortcutModal();
            });
        }
        bindTodoEvents();
        bindDashboardPanelEvents();
        initBrandMallOptions();
        refreshTerminalFilterOptions();
        applyFilters();
    </script>
</body>
