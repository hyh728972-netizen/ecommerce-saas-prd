<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 兆链采品牌商城后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; }
        .login-bg { 
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #dbeafe 100%);
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.8) 0%, transparent 70%);
            transform: rotate(-15deg);
        }
        .tab-active { color: #111827; border-bottom: 2px solid #2563eb; font-weight: 500; }
        .tab-inactive { color: #6b7280; border-bottom: 2px solid transparent; }
        .tab-inactive:hover { color: #374151; }
        .input-group { 
            background: #f9fafb; 
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }
        .input-group:focus-within {
            background: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-full flex">

    <!-- 左侧品牌区域 -->
    <div class="login-bg w-1/2 h-full flex flex-col justify-center items-center relative">
        <!-- Logo -->
        <div class="absolute top-12 left-12 flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center">
                <i class="fas fa-infinity text-white text-xl"></i>
            </div>
            <span class="text-3xl font-bold text-blue-600 tracking-wider">兆链采</span>
        </div>

        <!-- 主标题 -->
        <div class="text-center z-10 mt-20">
            <h1 class="text-4xl font-bold text-gray-900 mb-4 tracking-wide">品牌商城后台</h1>
        </div>

        <!-- 副标题 -->
        <div class="text-center z-10 mt-8">
            <p class="text-xl text-blue-500 font-medium tracking-widest">携手共建高效供应链生态</p>
        </div>

        <!-- 插画 -->
        <div class="mt-12 z-10 w-full max-w-lg">
            <svg viewBox="0 0 400 300" class="w-full h-auto">
                <!-- 地球仪 -->
                <circle cx="200" cy="150" r="80" fill="#6366f1" opacity="0.2"/>
                <circle cx="200" cy="150" r="60" fill="#6366f1" opacity="0.3"/>
                <ellipse cx="200" cy="150" rx="60" ry="20" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
                <line x1="140" y1="150" x2="260" y2="150" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
                
                <!-- 人物1 -->
                <circle cx="120" cy="220" r="15" fill="#f97316"/>
                <rect x="105" y="235" width="30" height="40" rx="5" fill="#3b82f6"/>
                
                <!-- 人物2 -->
                <circle cx="280" cy="200" r="15" fill="#f97316"/>
                <rect x="265" y="215" width="30" height="40" rx="5" fill="#8b5cf6"/>
                
                <!-- 人物3 -->
                <circle cx="180" cy="240" r="12" fill="#f97316"/>
                <rect x="168" y="252" width="24" height="35" rx="5" fill="#10b981"/>
                
                <!-- 饼图 -->
                <circle cx="80" cy="180" r="40" fill="#f97316" opacity="0.8"/>
                <path d="M 80 180 L 80 140 A 40 40 0 0 1 120 180 Z" fill="#fb923c"/>
                
                <!-- 三角尺 -->
                <polygon points="300,120 340,180 260,180" fill="none" stroke="#f97316" stroke-width="3"/>
                
                <!-- 柱状图 -->
                <rect x="320" y="160" width="15" height="40" fill="#3b82f6" opacity="0.7"/>
                <rect x="340" y="140" width="15" height="60" fill="#3b82f6" opacity="0.7"/>
                <rect x="360" y="170" width="15" height="30" fill="#3b82f6" opacity="0.7"/>
            </svg>
        </div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="w-1/2 h-full bg-white flex items-center justify-center">
        <div class="w-full max-w-md px-8">
            
            <!-- Tab切换 -->
            <div class="flex mb-8 border-b border-gray-200">
                <button onclick="switchTab('sms')" id="tab-sms" class="tab-active pb-3 px-4 text-base mr-8 transition-colors">
                    短信登录
                </button>
                <button onclick="switchTab('password')" id="tab-password" class="tab-inactive pb-3 px-4 text-base transition-colors">
                    密码登录
                </button>
            </div>

            <!-- 短信登录表单 -->
            <form id="form-sms" class="space-y-5 fade-in" onsubmit="event.preventDefault(); handleLogin();">
                <!-- 手机号输入 -->
                <div class="input-group rounded-lg flex items-center px-4 py-3">
                    <div class="flex items-center gap-2 border-r border-gray-300 pr-3 mr-3">
                        <span class="text-gray-700 text-sm">+86</span>
                        <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                    <input type="tel" placeholder="请输入手机号" 
                        class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400">
                </div>

                <!-- 验证码输入 -->
                <div class="input-group rounded-lg flex items-center px-4 py-3">
                    <input type="text" placeholder="请输入验证码" 
                        class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400">
                    <button type="button" onclick="getCode(this)" 
                        class="text-blue-600 text-sm font-medium hover:text-blue-700 whitespace-nowrap ml-2">
                        获取验证码
                    </button>
                </div>

                <!-- 操作链接 -->
                <div class="flex justify-between text-sm pt-2">
                    <a href="#" class="text-blue-600 hover:text-blue-700">免费注册</a>
                    <a href="#" class="text-gray-500 hover:text-gray-700">忘记密码</a>
                </div>

                <!-- 协议勾选 -->
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="agreement" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="agreement" class="text-sm text-gray-600">
                        我已阅读并同意 <a href="#" class="text-blue-600 hover:text-blue-700">供应商注册协议</a>
                    </label>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-full text-base font-medium transition-all hover:shadow-lg mt-4">
                    登录
                </button>
            </form>

            <!-- 密码登录表单 -->
            <form id="form-password" class="space-y-5 fade-in hidden" onsubmit="event.preventDefault(); handleLogin();">
                <!-- 手机号输入 -->
                <div class="input-group rounded-lg flex items-center px-4 py-3">
                    <div class="flex items-center gap-2 border-r border-gray-300 pr-3 mr-3">
                        <span class="text-gray-700 text-sm">+86</span>
                        <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                    <input type="tel" placeholder="请输入手机号" 
                        class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400">
                </div>

                <!-- 密码输入 -->
                <div class="input-group rounded-lg flex items-center px-4 py-3">
                    <input type="password" placeholder="请输入登录密码" 
                        class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400" id="password-input">
                    <i class="far fa-eye-slash text-gray-400 cursor-pointer hover:text-gray-600" onclick="togglePassword()"></i>
                </div>

                <!-- 操作链接 -->
                <div class="flex justify-between text-sm pt-2">
                    <a href="#" class="text-blue-600 hover:text-blue-700">免费注册</a>
                    <a href="#" class="text-gray-500 hover:text-gray-700">忘记密码</a>
                </div>

                <!-- 协议勾选 -->
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="agreement-pwd" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="agreement-pwd" class="text-sm text-gray-600">
                        我已阅读并同意 <a href="#" class="text-blue-600 hover:text-blue-700">供应商注册协议</a>
                    </label>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-full text-base font-medium transition-all hover:shadow-lg mt-4">
                    登录
                </button>
            </form>

            <!-- 其他登录方式 -->
            <div class="mt-10">
                <div class="flex items-center gap-4 mb-6">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-sm text-gray-400">其他登录方式</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>
                
                <div class="flex justify-center">
                    <button class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition-colors">
                        <i class="fab fa-weixin text-2xl text-green-500"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

<script>
    let countdown = 0;

    function switchTab(type) {
        const smsTab = document.getElementById('tab-sms');
        const pwdTab = document.getElementById('tab-password');
        const smsForm = document.getElementById('form-sms');
        const pwdForm = document.getElementById('form-password');

        if (type === 'sms') {
            smsTab.className = 'tab-active pb-3 px-4 text-base mr-8 transition-colors';
            pwdTab.className = 'tab-inactive pb-3 px-4 text-base transition-colors';
            smsForm.classList.remove('hidden');
            pwdForm.classList.add('hidden');
        } else {
            pwdTab.className = 'tab-active pb-3 px-4 text-base transition-colors';
            smsTab.className = 'tab-inactive pb-3 px-4 text-base mr-8 transition-colors';
            pwdForm.classList.remove('hidden');
            smsForm.classList.add('hidden');
        }
    }

    function getCode(btn) {
        if (countdown > 0) return;
        
        btn.textContent = '60s';
        btn.classList.add('text-gray-400');
        btn.classList.remove('text-blue-600', 'hover:text-blue-700');
        
        countdown = 60;
        const timer = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                btn.textContent = '获取验证码';
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-blue-600', 'hover:text-blue-700');
            } else {
                btn.textContent = countdown + 's';
            }
        }, 1000);
    }

    function togglePassword() {
        const input = document.getElementById('password-input');
        const icon = input.nextElementSibling;
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }

    function handleLogin() {
        alert('登录成功！');
    }
</script>

</body>
</html>
