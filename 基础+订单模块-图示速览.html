<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基础模块 + 订单模块 · 图示速览</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f8fafc; --paper-2:#eef4fa; --ink:#1a2a3a; --muted:#3a6b8a;
    --soft:#5a8aaa; --rule:rgba(26,42,58,.10); --accent:#1a5276;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Geist',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:48px 24px 80px;
  }
  .wrap{max-width:1040px;margin:0 auto}
  header{margin-bottom:48px}
  .eyebrow{
    font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin:0 0 12px;
  }
  h1{
    font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;
    line-height:1.15;margin:0 0 14px;letter-spacing:.005em;
  }
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0;max-width:680px}
  .ruletag{
    display:inline-block;margin-top:14px;font-family:'Geist Mono',monospace;
    font-size:11px;letter-spacing:.04em;color:var(--accent);
    background:rgba(26,82,118,.08);border:1px solid rgba(26,82,118,.30);
    padding:5px 10px;border-radius:4px;
  }
  figure{
    margin:0 0 44px;background:var(--paper-2);
    border:1px solid var(--rule);border-radius:8px;padding:24px 24px 20px;
    overflow-x:auto;
  }
  figure h2{
    font-family:'Instrument Serif',serif;font-weight:400;font-size:22px;
    margin:0 0 2px;letter-spacing:.005em;
  }
  .cap{
    font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.10em;
    text-transform:uppercase;color:var(--soft);margin:0 0 16px;
  }
  .note{color:var(--muted);font-size:12px;line-height:1.55;margin:12px 0 0}
  .note b{color:var(--ink);font-weight:600}
  svg{display:block;margin:0 auto;max-width:100%;height:auto}
  footer{
    margin-top:24px;padding-top:20px;border-top:1px solid var(--rule);
    font-family:'Geist Mono',monospace;font-size:10px;color:var(--soft);
    letter-spacing:.10em;
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Module Overview · Schematic</p>
  <h1>基础模块 + 订单模块</h1>
  <p class="sub">用图看懂两个模块的结构、状态与流转。基础模块搭租户链与平台基础能力，订单模块承载交易履约；两模块通过租户隔离、结算、支付、物流连接。</p>
  <span class="ruletag">版本规则：V1.3 优先 · V1.3 未覆盖处回退 V1.0~V1.2</span>
</header>

<!-- ============ 图1 多租户层级 ============ -->
<figure>
  <h2>① 多租户层级结构</h2>
  <p class="cap">基础模块 · 平台 → 企业客户 → 品牌商城 → C端用户</p>
  <svg viewBox="0 0 720 448" role="img" aria-label="多租户层级">
    <defs>
      <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#3a6b8a"/></marker>
    </defs>
    <!-- connectors (drawn first) -->
    <line x1="360" y1="96" x2="360" y2="140" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a1)"/>
    <line x1="360" y1="204" x2="360" y2="248" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a1)"/>
    <line x1="360" y1="312" x2="360" y2="356" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a1)"/>
    <!-- cardinality masks + labels -->
    <rect x="368" y="112" width="28" height="12" rx="2" fill="#eef4fa"/>
    <text x="382" y="121" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1 : n</text>
    <rect x="368" y="220" width="28" height="12" rx="2" fill="#eef4fa"/>
    <text x="382" y="229" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1 : n</text>
    <rect x="368" y="328" width="28" height="12" rx="2" fill="#eef4fa"/>
    <text x="382" y="337" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1 : n</text>

    <!-- N1 平台运营方 -->
    <rect x="240" y="32" width="240" height="64" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
    <text x="360" y="58" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">平台运营方</text>
    <text x="360" y="78" fill="#3a6b8a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">商城运营端 · 管全平台</text>

    <!-- N2 企业客户 -->
    <rect x="240" y="140" width="240" height="64" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
    <text x="360" y="166" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">企业客户</text>
    <text x="360" y="186" fill="#3a6b8a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">主体 · 结算信息 · OA 认证</text>

    <!-- N3 品牌商城 (focal) -->
    <rect x="240" y="248" width="240" height="64" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
    <text x="360" y="274" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">品牌商城</text>
    <text x="360" y="294" fill="#3a6b8a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">实例 · 登录账号 · 销售模式</text>

    <!-- N4 C端用户 -->
    <rect x="240" y="356" width="240" height="64" rx="6" fill="rgba(58,107,138,0.10)" stroke="#5a8aaa" stroke-width="1"/>
    <text x="360" y="382" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">C 端用户</text>
    <text x="360" y="402" fill="#3a6b8a" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">买家 · 由商城端建档</text>
  </svg>
  <p class="note"><b>品牌商城</b>是租户边界（图中高亮）：商品/订单/积分等所有数据都挂在它下面隔离。<b>销售模式</b>决定对接哪些前端（小程序 / PC / H5 / 线下 / API）。</p>
</figure>

<!-- ============ 图2 企业客户生命周期 ============ -->
<figure>
  <h2>② 企业客户生命周期</h2>
  <p class="cap">基础模块 V1.3 · 渠道管理 · OA 认证 + 解约续约联动</p>
  <svg viewBox="0 0 760 360" role="img" aria-label="企业客户状态机">
    <defs>
      <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#3a6b8a"/></marker>
      <marker id="a2f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#1a5276"/></marker>
    </defs>
    <!-- start dot -->
    <circle cx="76" cy="180" r="6" fill="#1a2a3a"/>
    <!-- start -> 审核中 -->
    <line x1="82" y1="180" x2="116" y2="180" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a2)"/>
    <rect x="80" y="160" width="40" height="12" rx="2" fill="#eef4fa"/>
    <text x="100" y="169" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">提交OA</text>

    <!-- 审核中 -> 正常 -->
    <line x1="244" y1="180" x2="316" y2="180" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a2)"/>
    <rect x="252" y="160" width="56" height="12" rx="2" fill="#eef4fa"/>
    <text x="280" y="169" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">OA 通过</text>

    <!-- 正常 -> 已解约 -->
    <line x1="444" y1="180" x2="516" y2="180" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a2)"/>
    <rect x="466" y="160" width="28" height="12" rx="2" fill="#eef4fa"/>
    <text x="480" y="169" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">解约</text>

    <!-- 正常 -> 审核中 (curve above) -->
    <path d="M 324 152 Q 284 104 244 152" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#a2)"/>
    <rect x="252" y="100" width="64" height="12" rx="2" fill="#eef4fa"/>
    <text x="284" y="109" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">编辑 · 重审</text>

    <!-- 已解约 -> 正常 (curve below) -->
    <path d="M 516 208 Q 480 252 444 208" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#a2)"/>
    <rect x="466" y="240" width="28" height="12" rx="2" fill="#eef4fa"/>
    <text x="480" y="249" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">续约</text>

    <!-- 审核中 self-loop (驳回) -->
    <path d="M 148 152 Q 148 116 180 116 Q 212 116 212 152" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#a2)"/>
    <rect x="160" y="104" width="40" height="12" rx="2" fill="#eef4fa"/>
    <text x="180" y="113" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">驳回</text>

    <!-- states -->
    <rect x="124" y="152" width="120" height="56" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
    <text x="184" y="178" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">审核中</text>
    <text x="184" y="195" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">OA APPROVAL</text>

    <rect x="324" y="152" width="120" height="56" rx="8" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
    <text x="384" y="178" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">正常（合作中）</text>
    <text x="384" y="195" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ACTIVE</text>

    <rect x="516" y="152" width="120" height="56" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
    <text x="576" y="178" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">已解约</text>
    <text x="576" y="195" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">TERMINATED</text>

    <!-- callout -->
    <text x="384" y="316" fill="#3a6b8a" font-size="14" font-style="italic" font-family="'Instrument Serif',serif" text-anchor="middle">解约 → 自动禁用名下所有品牌商城 ｜ 续约 → 自动恢复启用</text>
  </svg>
  <p class="note"><b>只有"正常"状态</b>的企业客户可被品牌商城关联。编辑企业客户会重新触发 OA 审核；品牌商城新增免审核、直接生效。</p>
</figure>

<!-- ============ 图3 订单状态机 ============ -->
<figure>
  <h2>③ 订单状态机</h2>
  <p class="cap">订单模块 V1.3 · 主流程 5 态（无"部分发货"）</p>
  <svg viewBox="0 0 800 320" role="img" aria-label="订单状态机">
    <defs>
      <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#3a6b8a"/></marker>
      <marker id="a3f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#1a5276"/></marker>
    </defs>
    <!-- start -->
    <circle cx="44" cy="140" r="6" fill="#1a2a3a"/>
    <line x1="50" y1="140" x2="76" y2="140" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a3)"/>
    <rect x="46" y="120" width="32" height="12" rx="2" fill="#eef4fa"/>
    <text x="62" y="129" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">下单</text>

    <!-- 待付款 -> 待发货 -->
    <line x1="204" y1="140" x2="256" y2="140" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a3)"/>
    <rect x="200" y="120" width="64" height="12" rx="2" fill="#eef4fa"/>
    <text x="232" y="129" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">买家付款</text>

    <!-- 待发货 -> 已发货 -->
    <line x1="384" y1="140" x2="436" y2="140" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a3)"/>
    <rect x="372" y="120" width="80" height="12" rx="2" fill="#eef4fa"/>
    <text x="412" y="129" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">供应链发货</text>

    <!-- 已发货 -> 已完成 (accent, focal path) -->
    <line x1="564" y1="140" x2="616" y2="140" stroke="#1a5276" stroke-width="1.2" marker-end="url(#a3f)"/>
    <rect x="556" y="120" width="72" height="12" rx="2" fill="#eef4fa"/>
    <text x="592" y="129" fill="#1a5276" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">确认收货</text>

    <!-- 待付款 -> 已关闭 (down) -->
    <line x1="140" y1="166" x2="140" y2="232" stroke="#3a6b8a" stroke-width="1" marker-end="url(#a3)"/>
    <rect x="152" y="188" width="72" height="24" rx="2" fill="#eef4fa"/>
    <text x="188" y="199" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">超时未付</text>
    <text x="188" y="209" fill="#3a6b8a" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">/ 取消</text>

    <!-- 已完成 -> end -->
    <line x1="744" y1="140" x2="772" y2="140" stroke="#3a6b8a" stroke-width="1"/>
    <circle cx="780" cy="140" r="8" fill="none" stroke="#1a2a3a" stroke-width="1"/>
    <circle cx="780" cy="140" r="4" fill="#1a2a3a"/>
    <!-- 已关闭 -> end -->
    <line x1="204" y1="260" x2="252" y2="260" stroke="#3a6b8a" stroke-width="1"/>
    <circle cx="260" cy="260" r="8" fill="none" stroke="#1a2a3a" stroke-width="1"/>
    <circle cx="260" cy="260" r="4" fill="#1a2a3a"/>

    <!-- states -->
    <rect x="80" y="114" width="124" height="52" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>

    <rect x="260" y="114" width="124" height="52" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>

    <rect x="440" y="114" width="124" height="52" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
    <text x="502" y="138" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">已发货</text>
    <text x="502" y="154" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SHIPPED</text>

    <rect x="620" y="114" width="124" height="52" rx="8" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
    <text x="682" y="138" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">已完成</text>
    <text x="682" y="154" fill="#5a8aaa" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">COMPLETED</text>

    <rect x="80" y="234" width="124" height="52" rx="8" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>

  </svg>

</figure>

<!-- ============ 图4 售后状态机 ============ -->
<figure>
  <h2>④ 售后状态机</h2>

      <marker id="a4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#3a6b8a"/></marker>
      <marker id="a4f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#1a5276"/></marker>
    </defs>
    <!-- start -->

    <circle cx="360" cy="376" r="8" fill="none" stroke="#1a2a3a" stroke-width="1"/>
    <circle cx="360" cy="376" r="4" fill="#1a2a3a"/>

    <!-- states -->
